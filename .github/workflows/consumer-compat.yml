name: Consumer Compatibility Check

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "rust/Cargo.toml"
      - "rust-runner-client/Cargo.toml"
      - "rust-vision-core/Cargo.toml"
      - "code-graph/Cargo.toml"
      - "package.json"
      - "pyproject.toml"
      - ".github/workflows/consumer-compat.yml"

jobs:
  check-version-bump:
    name: Check Version Bump & Consumer Compat
    runs-on: ubuntu-latest
    outputs:
      version_bumped: ${{ steps.detect.outputs.version_bumped }}
      new_version: ${{ steps.detect.outputs.new_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        run: |
          set -e
          git fetch origin main:main
          BASE_VERSION=$(git show main:rust/Cargo.toml | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/')
          HEAD_VERSION=$(grep '^version = ' rust/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Base version: $BASE_VERSION"
          echo "Head version: $HEAD_VERSION"
          if [ "$BASE_VERSION" != "$HEAD_VERSION" ]; then
            echo "version_bumped=true" >> $GITHUB_OUTPUT
            echo "new_version=$HEAD_VERSION" >> $GITHUB_OUTPUT
            echo "Version bump detected: $BASE_VERSION -> $HEAD_VERSION"
          else
            echo "version_bumped=false" >> $GITHUB_OUTPUT
            echo "No version bump detected"
          fi

      - name: Check upstream-of label requirement
        if: steps.detect.outputs.version_bumped == 'true'
        run: |
          PR_DATA='${{ github.event.pull_request.labels }}'
          HAS_UPSTREAM=$(echo "$PR_DATA" | jq -r '.[] | select(.name | startswith("coord:upstream-of")) | .name' | wc -l)
          if [ $HAS_UPSTREAM -eq 0 ]; then
            echo "❌ Version bump detected but no coord:upstream-of label found"
            echo ""
            echo "Version bumps must declare downstream consumers."
            echo "Use /coord-pr-label to add labels:"
            echo "  /coord-pr-label upstream-of qontinui-runner"
            echo "  /coord-pr-label upstream-of qontinui-web"
            echo ""
            exit 1
          fi
          echo "✓ Found upstream-of label(s):"
          echo "$PR_DATA" | jq -r '.[] | select(.name | startswith("coord:upstream-of")) | .name'

  test-consumer:
    name: "Test Consumer: ${{ matrix.consumer }}"
    needs: check-version-bump
    if: needs.check-version-bump.outputs.version_bumped == 'true'
    strategy:
      matrix:
        consumer:
          - qontinui-runner
          - qontinui-web
          - ui-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Extract consumer from label
        id: extract
        run: |
          PR_DATA='${{ github.event.pull_request.labels }}'
          CONSUMER_MATCH=$(echo "$PR_DATA" | jq -r ".[] | select(.name == \"coord:upstream-of=${{ matrix.consumer }}\") | .name")
          if [ -z "$CONSUMER_MATCH" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Consumer ${{ matrix.consumer }} not declared in upstream-of labels, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Testing consumer: ${{ matrix.consumer }}"
          fi

      - uses: actions/checkout@v5
        if: steps.extract.outputs.skip == 'false'
        with:
          path: schemas-pr

      - uses: actions/checkout@v5
        if: steps.extract.outputs.skip == 'false'
        with:
          repository: qontinui/${{ matrix.consumer }}
          path: consumer

      - uses: dtolnay/rust-toolchain@stable
        if: steps.extract.outputs.skip == 'false' && (matrix.consumer == 'qontinui-runner' || matrix.consumer == 'ui-bridge')
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        if: steps.extract.outputs.skip == 'false' && (matrix.consumer == 'qontinui-web' || matrix.consumer == 'qontinui-runner')
        with:
          node-version: "20"

      - uses: Swatinem/rust-cache@v2
        if: steps.extract.outputs.skip == 'false' && (matrix.consumer == 'qontinui-runner' || matrix.consumer == 'ui-bridge')
        with:
          workspaces: consumer

      - uses: actions/setup-node@v4
        if: steps.extract.outputs.skip == 'false' && (matrix.consumer == 'qontinui-web' || matrix.consumer == 'qontinui-runner')
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: consumer/package-lock.json

      - name: Test Consumer Build
        if: steps.extract.outputs.skip == 'false'
        run: |
          cd consumer
          if [ "${{ matrix.consumer }}" = "qontinui-runner" ] || [ "${{ matrix.consumer }}" = "qontinui-web" ]; then
            npm run type-check || exit 1
          fi
          if [ "${{ matrix.consumer }}" = "qontinui-runner" ] || [ "${{ matrix.consumer }}" = "ui-bridge" ]; then
            cargo check --workspace || exit 1
          fi
