name: python-tests

# Runs the Python test suite (`tests/`), including the Python half of the
# cross-language fixture contract in `tests/test_round_trip.py`.
#
# WHY THIS WORKFLOW EXISTS
#
# The fixture contract (`tests/fixtures/*.json`) is checked from BOTH sides:
# `rust/tests/round_trip.rs` in `rust-ci`, and `tests/test_round_trip.py`
# here. Before this workflow no job ran pytest at all, so the Python half —
# which is the half that exercises the GENERATED Pydantic models — was
# enforced only on whichever laptop happened to run it. `schema-drift`
# proves the generated bytes match the Rust source; it never asks whether
# those models accept the wire shapes the Rust side emits. That is exactly
# the gap a nullable-but-not-required field fell through during plan
# `2026-09-05-every-bounded-read-is-a-page-that-reads-as-a-corpus` Phase 1:
# the bytes were in sync, and the model silently defaulted an ABSENT key to
# `None`. The byte-identical JCS round-trips for `BoundedReadMeta` only
# guard anything if something runs them.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test dependencies
        run: pip install -e . 'pytest>=9,<10' 'pytest-asyncio>=1.3,<2'

      - name: Run pytest
        run: python -m pytest tests/ -q
