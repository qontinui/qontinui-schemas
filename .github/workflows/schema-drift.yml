name: schema-drift

# Fails CI when the generated TypeScript or Python type bindings under
# qontinui-schemas/ are out of sync with the Rust sources that drive them.
#
# Trigger scope: this side catches drift introduced by changes to
# qontinui-schemas's own Rust sources. The mirror workflow in
# qontinui-runner (`qontinui-types-drift.yml`) catches drift introduced
# by changes to runner-side schema files (`src-tauri/src/schema_export.rs`,
# `tauri_event_payloads.rs`, `relay_envelopes.rs`, `scripts/generate_types.sh`).
# Together they form a two-sided gate around the cross-repo codegen
# contract.
#
# qontinui-schemas is a standalone repo; this workflow recreates the
# sibling layout (qontinui-schemas/ + qontinui-runner/ at $GITHUB_WORKSPACE)
# that generate_types.sh and the runner crate's path-deps expect.
#
# WHERE THE CONSUMER COMPILE WENT (this is not a coverage drop). This
# workflow used to carry a second job, `check-consumers`, which compiled
# qontinui-runner against the PR's schemas. That job is gone and its
# coverage is now STRICTLY LARGER, in runner-consumer-check.yml:
#
#   - it is a MATRIX over consumers (qontinui-runner AND
#     qontinui-supervisor), not a single hardcoded consumer;
#   - it compiles consumer `main` UNCONDITIONALLY, and only falls back to
#     a DECLARED, open, main-based, SHA-pinned adaptation PR when main
#     breaks — where `check-consumers` had no escape hatch at all;
#   - its required context is `consumer-gate`, which replaced
#     `check-consumers` in ruleset 16104588 on 2026-08-04.
#
# Keeping both meant compiling the runner workspace TWICE per PR (~33 min
# of runner-minutes). `check-drift` stays here because it is a genuinely
# different check: codegen freshness, not consumer compilation.

on:
  # Manual trigger: useful when a cross-repo coordination fix lands on
  # qontinui-runner main but nothing on qontinui-schemas main has
  # touched rust/src/** since — the workflow's last main run can stay
  # cosmetically red for a long stretch even though the underlying
  # drift is fixed. `gh workflow run schema-drift.yml --ref main`
  # refreshes the visible status without forcing a noop rust/src/**
  # commit.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rust/src/**"
      # The gate must re-run when the gate itself changes. The pull_request
      # trigger below is unfiltered so it always does; this makes the
      # post-merge main run match, rather than leaving main's visible status
      # frozen at whatever the last rust/src/** push produced.
      - ".github/workflows/schema-drift.yml"
  pull_request:
    branches: [main]
    # No path filter on the PR trigger so the `check-drift` required-check
    # status posts on every PR. Required-check rules look for check-runs
    # created by the pull_request event; a path-filtered trigger that
    # doesn't fire (e.g. the release-please bot's PR, which only touches
    # rust/Cargo.toml + rust/CHANGELOG.md, not rust/src/**) leaves the
    # required check in the "missing" state and the PR fails the rule
    # with no way to satisfy it short of admin bypass. Running the full
    # regen on every PR is ~2 min wasted on irrelevant PRs but is the
    # only mechanism that posts the required status. PRs without
    # rust/src/** changes will produce no diff and pass quickly.

jobs:
  check-drift:
    runs-on: ubuntu-latest
    # ONE value for the generator's path, used by every step that touches it:
    # the two check-generated-drift.sh invocations PARSE this script (to prove
    # its output dirs are the ones they inspect), and the regen step EXECUTES
    # it. Before this was hoisted, those were two independently-written path
    # strings that merely happened to agree — so the script being cross-checked
    # was not provably the script being run, which is the same
    # "coupled-by-convention" defect the cross-check itself exists to close.
    # Absolute, because the gate runs with working-directory: qontinui-schemas
    # while the regen step runs from $GITHUB_WORKSPACE.
    env:
      GENERATE_TYPES_SH: ${{ github.workspace }}/qontinui-runner/src-tauri/scripts/generate_types.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: qontinui-schemas

      - name: Checkout qontinui-runner (sibling)
        uses: actions/checkout@v5
        with:
          repository: qontinui/qontinui-runner
          path: qontinui-runner

      # generate_types.sh runs `cargo build --bin export_schemas` which
      # links the runner lib (Tauri-dependent). Tauri 2.x on Linux probes
      # for libwebkit2gtk-4.1, libsoup, libgtk etc. via pkg-config in
      # build scripts. Without these, cargo aborts at link/probe time.
      # Mirrors the canonical list from qontinui-runner/.github/workflows/ci.yml.
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # compile_typescript.mjs does `import { compile } from
      # 'json-schema-to-typescript'` from qontinui-schemas/scripts/.
      # Node ESM resolution walks up to qontinui-schemas/node_modules/,
      # so the package must be installed locally (a global -g install
      # is not in Node ESM's default resolution path). package-lock.json
      # is .gitignore'd, so `npm install` (not `npm ci`) — fresh resolve
      # from the registry each run.
      #
      # That is only safe because both codegen deps are pinned EXACTLY (no
      # caret) in qontinui-schemas/package.json: `json-schema-to-typescript`
      # emits the .d.ts and `prettier` formats it, so either floating would
      # surface every upstream release as fresh "drift" on PRs that changed
      # nothing — the same reason datamodel-code-generator is pinned below.
      # Until this change the TS side had no pin and it did not matter,
      # because the TS arm of this gate was vacuously green. Now that it has
      # signal, an unpinned generator would red every PR in both repos and
      # read as "the new gate is broken" — which is how anti-vacuity guards
      # get reverted. Bump deliberately, and regenerate in the same commit.
      - name: Install qontinui-schemas npm deps
        working-directory: qontinui-schemas
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pin datamodel-code-generator: each minor version tweaks Pydantic
      # output (e.g. 0.56→0.57 adds `from pydantic import Field` imports
      # to enum-only modules). Without a pin, every upstream release would
      # surface as fresh "drift" until someone regen'd locally with the
      # new version. Bump deliberately, not by accident.
      - name: Install datamodel-code-generator
        run: pip install 'datamodel-code-generator==0.57.0'

      # tauri_build::build() in qontinui-runner/src-tauri/build.rs reads
      # tauri.conf.json's `frontendDist: "../dist"` and panics if the path
      # doesn't exist. We don't actually need a real frontend build for
      # schema export — the export_schemas binary only touches Rust schemar
      # registries — so stub an empty dist/ with a placeholder index.html.
      # The build script's `tauri::generate_context!()` will embed the
      # placeholder, which is fine: the binary that reads the embedded
      # frontend (the actual runner) is never invoked here.
      - name: Stub qontinui-runner frontend dist
        run: |
          mkdir -p qontinui-runner/dist
          printf '<!DOCTYPE html><html><head></head><body>schema-drift CI stub</body></html>\n' > qontinui-runner/dist/index.html

      # generate_types.sh warns-and-skips instead of failing when node or
      # datamodel-codegen is missing, leaving the working tree pristine — which
      # would make every arm of the check below report a green it never
      # verified. The arms verify the BASELINE; this verifies that the
      # REGENERATION will actually happen. See the script for detail.
      - name: Preflight — codegen toolchain present
        working-directory: qontinui-schemas
        run: bash scripts/check-generated-drift.sh --preflight

      # CARGO_TARGET_DIR override: qontinui-runner is a workspace (Cargo.toml
      # at the runner root declares [workspace] members = ["src-tauri", ...]),
      # so cargo's default target-dir is qontinui-runner/target/. But
      # generate_types.sh:21 hardcodes
      # SCHEMAS_JSON="$PROJECT_ROOT/target/schemas.json" where
      # $PROJECT_ROOT = qontinui-runner/src-tauri/. Force cargo to write to
      # the script-expected per-package target dir so the bash redirection
      # on script line 73 finds an existing target/ parent.
      - name: Regenerate types
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/qontinui-runner/src-tauri/target
        run: bash "$GENERATE_TYPES_SH"

      # Uploaded on failed runs too, so a red drift check hands the developer
      # the exact bytes CI expected instead of only a diff to reverse-engineer.
      # Reproducing this output locally needs the full sibling-runner Rust
      # toolchain plus the pinned datamodel-codegen; downloading the artifact
      # and committing it is the cheap path.
      #
      # `!cancelled()` rather than `always()`: `always()` also runs during
      # cancellation, and `continue-on-error` keeps a transient upload blip
      # from reddening an otherwise-green gate. This artifact is purely
      # diagnostic — it must never be the reason the gate fails, in either
      # direction.
      - name: Upload regenerated bindings
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bindings
          path: |
            qontinui-schemas/ts/src/generated
            qontinui-schemas/src/qontinui_schemas/generated
          # `warn`, not `error`: this step runs on failed runs too, and a
          # regen that died before writing anything must surface as the regen
          # failure it is, not as a second, misleading upload failure.
          if-no-files-found: warn

      # The anti-vacuity guard. Implementation lives in this repo's
      # scripts/check-generated-drift.sh, and qontinui-runner's mirror
      # workflow (qontinui-types-drift.yml) invokes THE SAME FILE from the
      # checkout it already makes of this repo.
      #
      # That is deliberate. The two workflows are one cross-repo contract, and
      # a comment asking humans to keep them in step is not a mechanism — they
      # diverged once inside a single change. Sharing the script makes the
      # check travel on the same branch as the bindings it guards.
      #
      # Short version of what it does: `git diff` is blind to untracked files,
      # so a gate that only diffs can be silenced by untracking its own
      # baseline. That is exactly what happened — ts/src/generated was swept
      # out of the index in 34709ada and this workflow's TypeScript arm was
      # vacuously green from then until the change that added this script. So
      # the script also asserts the baseline exists (arm 0) and looks for
      # untracked regenerated output (arm 1), not just a diff (arm 2).
      - name: Check for drift
        working-directory: qontinui-schemas
        run: bash scripts/check-generated-drift.sh --verify
