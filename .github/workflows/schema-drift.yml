name: schema-drift

# Fails CI when the generated TypeScript or Python type bindings under
# qontinui-schemas/ are out of sync with the Rust sources that drive them.
#
# Trigger scope: this side catches drift introduced by changes to
# qontinui-schemas's own Rust sources. The mirror workflow in
# qontinui-runner (`qontinui-types-drift.yml`) catches drift introduced
# by changes to runner-side schema files (`src-tauri/src/schema_export.rs`,
# `tauri_event_payloads.rs`, `relay_envelopes.rs`, `scripts/generate_types.sh`).
# Together they form a two-sided gate around the cross-repo codegen
# contract.
#
# qontinui-schemas is a standalone repo; this workflow recreates the
# sibling layout (qontinui-schemas/ + qontinui-runner/ at $GITHUB_WORKSPACE)
# that generate_types.sh and the runner crate's path-deps expect.

on:
  # Manual trigger: useful when a cross-repo coordination fix lands on
  # qontinui-runner main but nothing on qontinui-schemas main has
  # touched rust/src/** since — the workflow's last main run can stay
  # cosmetically red for a long stretch even though the underlying
  # drift is fixed. `gh workflow run schema-drift.yml --ref main`
  # refreshes the visible status without forcing a noop rust/src/**
  # commit.
  workflow_dispatch:
    inputs:
      # Manual dispatch already runs check-consumers fully (see the
      # early-exit step: dispatch is treated as an explicit ask), so
      # today this input is a belt-and-braces override. It exists so
      # the consumer gate can always be exercised post-merge without a
      # rust/src/** commit even if the dispatch path is ever tightened,
      # e.g. `gh workflow run schema-drift.yml --ref main -f force_consumers=true`.
      # On push/pull_request events the input is absent (empty string)
      # and the gate logic treats it as false — behavior unchanged.
      force_consumers:
        description: "Force the check-consumers compile gate to run fully"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "rust/src/**"
      # The gate must re-run when the gate itself changes. The pull_request
      # trigger below is unfiltered so it always does; this makes the
      # post-merge main run match, rather than leaving main's visible status
      # frozen at whatever the last rust/src/** push produced.
      - ".github/workflows/schema-drift.yml"
  pull_request:
    branches: [main]
    # No path filter on the PR trigger so the `check-drift` required-check
    # status posts on every PR. Required-check rules look for check-runs
    # created by the pull_request event; a path-filtered trigger that
    # doesn't fire (e.g. the release-please bot's PR, which only touches
    # rust/Cargo.toml + rust/CHANGELOG.md, not rust/src/**) leaves the
    # required check in the "missing" state and the PR fails the rule
    # with no way to satisfy it short of admin bypass. Running the full
    # regen on every PR is ~2 min wasted on irrelevant PRs but is the
    # only mechanism that posts the required status. PRs without
    # rust/src/** changes will produce no diff and pass quickly.

jobs:
  check-drift:
    runs-on: ubuntu-latest
    # ONE value for the generator's path, used by every step that touches it:
    # the two check-generated-drift.sh invocations PARSE this script (to prove
    # its output dirs are the ones they inspect), and the regen step EXECUTES
    # it. Before this was hoisted, those were two independently-written path
    # strings that merely happened to agree — so the script being cross-checked
    # was not provably the script being run, which is the same
    # "coupled-by-convention" defect the cross-check itself exists to close.
    # Absolute, because the gate runs with working-directory: qontinui-schemas
    # while the regen step runs from $GITHUB_WORKSPACE.
    env:
      GENERATE_TYPES_SH: ${{ github.workspace }}/qontinui-runner/src-tauri/scripts/generate_types.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: qontinui-schemas

      - name: Checkout qontinui-runner (sibling)
        uses: actions/checkout@v5
        with:
          repository: qontinui/qontinui-runner
          path: qontinui-runner

      # generate_types.sh runs `cargo build --bin export_schemas` which
      # links the runner lib (Tauri-dependent). Tauri 2.x on Linux probes
      # for libwebkit2gtk-4.1, libsoup, libgtk etc. via pkg-config in
      # build scripts. Without these, cargo aborts at link/probe time.
      # Mirrors the canonical list from qontinui-runner/.github/workflows/ci.yml.
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # compile_typescript.mjs does `import { compile } from
      # 'json-schema-to-typescript'` from qontinui-schemas/scripts/.
      # Node ESM resolution walks up to qontinui-schemas/node_modules/,
      # so the package must be installed locally (a global -g install
      # is not in Node ESM's default resolution path). package-lock.json
      # is .gitignore'd, so `npm install` (not `npm ci`) — fresh resolve
      # from the registry each run.
      #
      # That is only safe because both codegen deps are pinned EXACTLY (no
      # caret) in qontinui-schemas/package.json: `json-schema-to-typescript`
      # emits the .d.ts and `prettier` formats it, so either floating would
      # surface every upstream release as fresh "drift" on PRs that changed
      # nothing — the same reason datamodel-code-generator is pinned below.
      # Until this change the TS side had no pin and it did not matter,
      # because the TS arm of this gate was vacuously green. Now that it has
      # signal, an unpinned generator would red every PR in both repos and
      # read as "the new gate is broken" — which is how anti-vacuity guards
      # get reverted. Bump deliberately, and regenerate in the same commit.
      - name: Install qontinui-schemas npm deps
        working-directory: qontinui-schemas
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pin datamodel-code-generator: each minor version tweaks Pydantic
      # output (e.g. 0.56→0.57 adds `from pydantic import Field` imports
      # to enum-only modules). Without a pin, every upstream release would
      # surface as fresh "drift" until someone regen'd locally with the
      # new version. Bump deliberately, not by accident.
      - name: Install datamodel-code-generator
        run: pip install 'datamodel-code-generator==0.57.0'

      # tauri_build::build() in qontinui-runner/src-tauri/build.rs reads
      # tauri.conf.json's `frontendDist: "../dist"` and panics if the path
      # doesn't exist. We don't actually need a real frontend build for
      # schema export — the export_schemas binary only touches Rust schemar
      # registries — so stub an empty dist/ with a placeholder index.html.
      # The build script's `tauri::generate_context!()` will embed the
      # placeholder, which is fine: the binary that reads the embedded
      # frontend (the actual runner) is never invoked here.
      - name: Stub qontinui-runner frontend dist
        run: |
          mkdir -p qontinui-runner/dist
          printf '<!DOCTYPE html><html><head></head><body>schema-drift CI stub</body></html>\n' > qontinui-runner/dist/index.html

      # generate_types.sh warns-and-skips instead of failing when node or
      # datamodel-codegen is missing, leaving the working tree pristine — which
      # would make every arm of the check below report a green it never
      # verified. The arms verify the BASELINE; this verifies that the
      # REGENERATION will actually happen. See the script for detail.
      - name: Preflight — codegen toolchain present
        working-directory: qontinui-schemas
        run: bash scripts/check-generated-drift.sh --preflight

      # CARGO_TARGET_DIR override: qontinui-runner is a workspace (Cargo.toml
      # at the runner root declares [workspace] members = ["src-tauri", ...]),
      # so cargo's default target-dir is qontinui-runner/target/. But
      # generate_types.sh:21 hardcodes
      # SCHEMAS_JSON="$PROJECT_ROOT/target/schemas.json" where
      # $PROJECT_ROOT = qontinui-runner/src-tauri/. Force cargo to write to
      # the script-expected per-package target dir so the bash redirection
      # on script line 73 finds an existing target/ parent.
      - name: Regenerate types
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/qontinui-runner/src-tauri/target
        run: bash "$GENERATE_TYPES_SH"

      # Uploaded on failed runs too, so a red drift check hands the developer
      # the exact bytes CI expected instead of only a diff to reverse-engineer.
      # Reproducing this output locally needs the full sibling-runner Rust
      # toolchain plus the pinned datamodel-codegen; downloading the artifact
      # and committing it is the cheap path.
      #
      # `!cancelled()` rather than `always()`: `always()` also runs during
      # cancellation, and `continue-on-error` keeps a transient upload blip
      # from reddening an otherwise-green gate. This artifact is purely
      # diagnostic — it must never be the reason the gate fails, in either
      # direction.
      - name: Upload regenerated bindings
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bindings
          path: |
            qontinui-schemas/ts/src/generated
            qontinui-schemas/src/qontinui_schemas/generated
          # `warn`, not `error`: this step runs on failed runs too, and a
          # regen that died before writing anything must surface as the regen
          # failure it is, not as a second, misleading upload failure.
          if-no-files-found: warn

      # The anti-vacuity guard. Implementation lives in this repo's
      # scripts/check-generated-drift.sh, and qontinui-runner's mirror
      # workflow (qontinui-types-drift.yml) invokes THE SAME FILE from the
      # checkout it already makes of this repo.
      #
      # That is deliberate. The two workflows are one cross-repo contract, and
      # a comment asking humans to keep them in step is not a mechanism — they
      # diverged once inside a single change. Sharing the script makes the
      # check travel on the same branch as the bindings it guards.
      #
      # Short version of what it does: `git diff` is blind to untracked files,
      # so a gate that only diffs can be silenced by untracking its own
      # baseline. That is exactly what happened — ts/src/generated was swept
      # out of the index in 34709ada and this workflow's TypeScript arm was
      # vacuously green from then until the change that added this script. So
      # the script also asserts the baseline exists (arm 0) and looks for
      # untracked regenerated output (arm 1), not just a diff (arm 2).
      - name: Check for drift
        working-directory: qontinui-schemas
        run: bash scripts/check-generated-drift.sh --verify

  # ------------------------------------------------------------------
  # check-consumers: downstream path-dep consumer compile gate.
  #
  # CONTRACT: a red check-consumers means this schema change breaks a
  # path-dep consumer's compile. Land the consumer catch-up PR together
  # with this change (schema lands -> catch-up lands immediately), or
  # fix the change. Do NOT merge over a red gate and leave the consumer
  # to discover the break on its own main.
  #
  # Why this exists: on 2026-07-05 a schemas change (v0.8.0 apps.rs —
  # new fields `update_strategy`/`build_command`/`start_command` plus
  # `AppError::InvalidUpdateStrategy`) landed with no runner catch-up.
  # qontinui-runner consumes qontinui-types via a path dependency
  # (src-tauri/Cargo.toml -> ../../qontinui-schemas/rust), so every
  # runner build immediately broke (E0063 x3, E0004), runner main went
  # red, and the runner merge train froze for ~60 hours with 8 green
  # PRs stuck. Plan: 2026-07-06-runner-ci-cross-repo-schema-drift-guard
  # (Phase 2 / design decision D1).
  #
  # Why `cargo check --workspace --all-targets` (load-bearing): the
  # check-drift job above builds only `--bin export_schemas`, which
  # links the runner *lib* only. The 2026-07-05 break lived in
  # bin-target code — the runner's `commands/` module is declared in
  # main.rs, not lib.rs — so a lib-only build stayed green while every
  # real runner build was red. `--all-targets` compiles bin + test
  # targets and closes exactly that blind spot.
  #
  # Consumer list — READ THIS BEFORE TRUSTING IT. This job compiles
  # qontinui-runner ONLY. That is NOT the full consumer set, and the
  # comment that used to claim "qontinui-runner is the only Rust
  # path-dep consumer today" was false by the time anyone read it:
  #
  #   qontinui-runner     src-tauri/Cargo.toml:125-127 — qontinui-types,
  #                       qontinui-code-graph, qontinui-vision-core
  #   qontinui-coord      Cargo.toml:91,97 — qontinui-types,
  #                       qontinui-code-graph            (NOT gated here)
  #   qontinui-supervisor Cargo.toml:57,58 — qontinui-types,
  #                       qontinui-runner-client         (see below)
  #
  # A hand-maintained consumer list decays silently — this one decayed
  # twice before anyone noticed. The durable coverage lives in
  # runner-consumer-check.yml, whose `consumer-check` job is a MATRIX
  # over consumers; add new consumers there, not here. coord is private,
  # so a schemas workflow cannot check it out with the default
  # GITHUB_TOKEN; the fleet has declined a cross-repo PAT for exactly
  # this shape (qontinui-supervisor/.github/workflows/ci.yml:87-95), so
  # coord is covered from its own side instead.
  #
  # Trigger/required-check convention (same as check-drift and
  # rust-ci.yml): the pull_request trigger carries NO paths: filter —
  # a path-filtered trigger that doesn't fire leaves a required check
  # "missing" and unsatisfiable. Instead the first step below computes
  # whether the PR touches rust/src/** and every heavy step is gated on
  # it, so irrelevant PRs go green in seconds. After this job's first
  # green run, register `check-consumers` in the schemas ruleset's
  # required checks (post-merge step — only require a context that has
  # a producer).
  # ------------------------------------------------------------------
  check-consumers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: qontinui-schemas
          # Full history so the early-exit step can diff the PR's
          # base...head range directly by sha.
          fetch-depth: 0

      # Early exit: only changes to a PATH-CONSUMED crate can break a
      # consumer's compile. Per event:
      #   pull_request      -> diff base..head; run only if a path-dep
      #                        surface path changed
      #   push              -> run fully (trigger is already path-filtered)
      #   workflow_dispatch -> run fully (a manual dispatch is an
      #                        explicit ask; force_consumers=true keeps
      #                        that guaranteed even if this ever changes)
      # When run_gate=false every subsequent step is skipped and the
      # job completes green in seconds — that is what keeps the
      # unfiltered pull_request trigger cheap on irrelevant PRs.
      #
      # THE PREDICATE SURFACE (do not narrow without re-deriving it).
      # This predicate used to read `^rust/src/` alone. That is the crate
      # `qontinui-types` and NOTHING ELSE, but this repo is a FOUR-crate
      # workspace (Cargo.toml: members = ["rust", "rust-runner-client",
      # "rust-vision-core", "code-graph"]) and three of the four are
      # path-consumed by somebody. So a change confined to any of the
      # other three self-skipped this job, which then reported SUCCESS
      # having compiled nothing.
      #
      # That is not hypothetical. schemas#104 ("widen vision-core Region
      # origin to signed i32") touched ONLY rust-vision-core/**. This job
      # logged `event=pull_request run_gate=false` and went green in SIX
      # SECONDS (run 29975577008, 2026-07-23T02:54:24Z -> 02:54:30Z) while
      # being the only consumer-compile context in the ruleset's required
      # list. Sixteen minutes after it landed, qontinui-runner main went
      # red with 11 x E0308 and stayed red 4h38m behind 16 open PRs.
      #
      # A vacuous self-skip on a compile gate renders as a green check,
      # which is why nobody noticed for 22 days. The surface below is the
      # same list runner-consumer-check.yml's `paths:` trigger already
      # uses — the two predicates now agree by construction rather than
      # by coincidence. Cargo.toml/Cargo.lock are load-bearing too:
      # consumers pin version RANGES (qontinui-supervisor/Cargo.toml:57
      # `version = ">=0.1.2, <2.0.0"`), so a manifest-only bump can break
      # a consumer's resolution.
      - name: Decide whether consumer compile gate must run
        id: gate
        working-directory: qontinui-schemas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Boolean workflow_dispatch input; empty string on push/PR
          # events — the :-false default below keeps those unchanged.
          FORCE_CONSUMERS: ${{ inputs.force_consumers }}
        run: |
          set -euo pipefail
          run_gate=false
          # Initialised before the case so the diagnostic echo below is
          # safe under `set -u` on push/dispatch events, where no diff is
          # computed at all.
          changed=""
          case "$EVENT_NAME" in
            pull_request)
              changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
              # Anchored alternation over the full path-dep surface.
              # `-E` + `^(...)` keeps every branch anchored at the start
              # of the path; an unanchored `Cargo.toml` would also match
              # `rust/Cargo.toml` (harmless here, but the anchor is what
              # makes the list auditable against the trigger it mirrors).
              if printf '%s\n' "$changed" | grep -qE '^(rust/|rust-vision-core/|code-graph/|rust-runner-client/|Cargo\.toml$|Cargo\.lock$)'; then
                run_gate=true
              fi
              ;;
            push|workflow_dispatch)
              run_gate=true
              ;;
          esac
          if [ "${FORCE_CONSUMERS:-false}" = "true" ]; then
            run_gate=true
          fi
          echo "run_gate=$run_gate" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME run_gate=$run_gate"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed" | sed 's/^/  changed: /'
          fi

      # Anti-vacuity assertion (plan 6.2). The failure this whole job
      # exists to prevent rendered as a GREEN CHECK, so "the gate decided
      # to run" and "the gate actually compiled" must be separately
      # observable. If run_gate is true, the compile step below is
      # REQUIRED to have executed; the guard at the end of this job
      # asserts exactly that and fails loudly if it did not.
      - name: Record gate decision for the anti-vacuity guard
        if: steps.gate.outputs.run_gate == 'true'
        run: echo "COMPILE_EXPECTED=1" >> "$GITHUB_ENV"

      - name: Checkout qontinui-runner (sibling)
        if: steps.gate.outputs.run_gate == 'true'
        uses: actions/checkout@v5
        with:
          repository: qontinui/qontinui-runner
          path: qontinui-runner

      # Same dep list as check-drift above: Tauri 2.x on Linux probes
      # for libwebkit2gtk-4.1, libsoup, libgtk etc. via pkg-config in
      # build scripts. Without these, cargo aborts at link/probe time.
      # Mirrors the canonical list from qontinui-runner/.github/workflows/ci.yml.
      - name: Install Tauri Linux system deps
        if: steps.gate.outputs.run_gate == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      - name: Set up Rust toolchain
        if: steps.gate.outputs.run_gate == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Cache keyed on the RUNNER workspace (that is what we compile);
      # target dir is relative to the workspace root and must match the
      # CARGO_TARGET_DIR used by the check step below.
      - name: Rust cache (runner workspace)
        if: steps.gate.outputs.run_gate == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: qontinui-runner -> target-consumer-check

      # tauri_build::build() in qontinui-runner/src-tauri/build.rs reads
      # tauri.conf.json's `frontendDist: "../dist"` and panics if the path
      # doesn't exist. We don't actually need a real frontend build for
      # schema export — the export_schemas binary only touches Rust schemar
      # registries — so stub an empty dist/ with a placeholder index.html.
      # The build script's `tauri::generate_context!()` will embed the
      # placeholder, which is fine: the binary that reads the embedded
      # frontend (the actual runner) is never invoked here.
      - name: Stub qontinui-runner frontend dist
        if: steps.gate.outputs.run_gate == 'true'
        run: |
          mkdir -p qontinui-runner/dist
          printf '<!DOCTYPE html><html><head></head><body>schema-drift CI stub</body></html>\n' > qontinui-runner/dist/index.html

      # OOM guard — copied from qontinui-runner/.github/workflows/ci.yml
      # ("Add swapfile" + CARGO_BUILD_JOBS notes there): hosted ubuntu
      # runners ship 16 GB RAM and this workspace's peak compile memory
      # exceeds it; the Linux OOM-killer then takes the runner AGENT down
      # and the job dies with exit code 143 and no rustc error. The first
      # forced run of this job (28772691807, 2026-07-06) failed exactly
      # that way ~25 min in. Same two mitigations as runner CI: pre-
      # allocate paging space AND single-threaded compile (JOBS=1 — the
      # runner CI found JOBS=2 still trips the OOM-killer even with swap).
      - name: Add swapfile (guard against compile OOM, exit 143)
        if: steps.gate.outputs.run_gate == 'true'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # The actual gate. --all-targets is load-bearing (see the job
      # header comment): a lib-only check rebuilds the exact blind spot
      # that let the 2026-07-05 apps.rs break through — the runner's
      # commands/ module lives under the bin target (main.rs), not the
      # lib. The sibling layout above resolves the runner's
      # `../../qontinui-schemas/rust` path dep to THIS PR's schema.
      - name: cargo check qontinui-runner (all targets) against proposed schema
        id: compile
        if: steps.gate.outputs.run_gate == 'true'
        working-directory: qontinui-runner
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/qontinui-runner/target-consumer-check
          # See the swapfile step above — JOBS=1 matches runner CI's
          # empirically-derived OOM mitigation for this workspace.
          CARGO_BUILD_JOBS: "1"
        run: |
          cargo check --workspace --all-targets
          echo "ran=1" >> "$GITHUB_OUTPUT"

      # ANTI-VACUITY GUARD. The defect that motivated widening the
      # predicate above was not a red that should have been green — it
      # was a job that compiled NOTHING and reported success, which is
      # indistinguishable from a real pass at the badge level. So assert
      # the two facts against each other: if the gate decided to run,
      # the compile step MUST have run. Without this, any future edit
      # that re-breaks the predicate (or mis-gates a step's `if:`)
      # silently restores the six-second green.
      #
      # `always()` so this cannot itself be skipped by an upstream
      # failure. It deliberately does NOT fail when run_gate=false —
      # a genuine cheap-exit on an irrelevant PR is the designed path.
      - name: Assert the gate was not vacuous
        if: always()
        env:
          RUN_GATE: ${{ steps.gate.outputs.run_gate }}
          COMPILE_RAN: ${{ steps.compile.outputs.ran }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          set -euo pipefail
          if [ "$RUN_GATE" != "true" ]; then
            echo "run_gate=false — cheap exit, nothing to assert."
            exit 0
          fi
          if [ "$COMPILE_RAN" = "1" ]; then
            echo "run_gate=true and the consumer compile executed (outcome=$COMPILE_OUTCOME). Gate is real."
            exit 0
          fi
          if [ "$COMPILE_OUTCOME" = "failure" ]; then
            echo "run_gate=true and the consumer compile ran and FAILED — that is a real red, not a vacuous one."
            exit 0
          fi
          echo "::error::VACUOUS GATE: run_gate=true but the consumer compile step did not execute (outcome=${COMPILE_OUTCOME:-<none>})."
          echo "This job is a REQUIRED check. A green here would assert 'consumers still compile' while having compiled nothing —"
          echo "exactly the failure of run 29975577008 that let schemas#104 red qontinui-runner main for 4h38m."
          exit 1
