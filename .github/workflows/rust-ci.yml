name: Rust CI

# Workspace-wide build / test / lint / fmt for the Rust crates in this repo.
#
# Triggers:
#   pull_request: every PR (no path filter). GitHub branch-protection
#     'required check' rules look for check-runs created by the
#     pull_request event; a path-filtered trigger that doesn't fire
#     (e.g. workflow-only edits or the release-please bot's PR) leaves
#     the required check 'missing' and the PR fails the rule with no
#     way to satisfy it short of admin bypass. Running the full
#     compile/test on every PR is the only mechanism that posts the
#     required status reliably; the Swatinem rust-cache makes
#     no-Rust-change PRs fast.
#   push: only when Rust sources actually change — main pushes that
#     don't touch Rust don't need to re-run.
#   workflow_dispatch: manual escape hatch — for re-running a job whose
#     failure was environmental. It is NOT a way to clear a red main, and
#     reaching for it there is the trap schema-drift.yml documents at
#     length. coord scores main from `coord.ci_baselines`, and
#     `establishes_main_baseline()` accepts `event == Some("push")` and
#     nothing else (qontinui-coord crates/coord/src/ci_baseline.rs); a
#     `workflow_dispatch` run neither writes NOR prunes that row. So a green
#     dispatch of THIS workflow leaves a green checkmark on GitHub while
#     coord still reports main-red and still holds every PR in this repo.
#     The remedy is `gh run rerun --failed <the failed push run>`: a re-run
#     reuses the run id, bumps `run_attempt` and KEEPS `event: push`, so
#     coord ingests a real baseline. This is not specific to `check-drift` —
#     the baseline table is keyed per repo and workflow name, so it applies
#     to every push-triggered gate here, this one included.
#   workflow_call: lets publish-rust.yml (F2 hard gate, per
#     qontinui-dev-notes/rust-release-engineering) reuse this job and
#     require it green for the tagged commit before publishing, and lets
#     candidate-ci.yml run it on coord's merge-candidate refs. The `route`
#     job below may move the Linux `rust-ci` job onto the self-hosted pool
#     for candidate-ci.yml and for this file's own push / dispatch runs —
#     never for publish-rust.yml, and never for a pull_request.

on:
  pull_request:
  push:
    branches: [main]
    # This list is the WORKSPACE, not a subset of it. Cargo.toml declares
    # members = ["rust", "rust-runner-client", "rust-vision-core",
    # "code-graph"]; omitting two of the four meant a landed change to
    # rust-vision-core/** or code-graph/** compiled NOTHING on main —
    # which is what happened when f8ee21db (schemas#104) was pushed on
    # 2026-07-28T00:08:39Z: it triggered release-please and nothing else,
    # so main's own CI never observed the break that reddened
    # qontinui-runner sixteen minutes later. Keep this in step with
    # runner-consumer-check.yml's `paths:` and check-consumers' in-job
    # predicate — all three describe the same path-dep surface.
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "rust-runner-client/**"
      - "rust-vision-core/**"
      - "code-graph/**"
      - "ci-exec/**"
      # Not a workspace member, but rust/tests/fleet_nouns_vocabulary.rs is
      # its only validator: a data-only edit must still run it on main.
      - "fleet-nouns.toml"
      - ".github/scripts/fleet-nouns-portability.*"
      # Not a workspace member either: rust/tests/glossary_source.rs is the
      # glossary source's only validator (invariants, fleet nouns, the version
      # guard, and drift of BOTH generated tables — rust/src/glossary/generated.rs
      # and ts/src/glossary/generated.ts), so an edit to either generated file
      # alone must still run it on main.
      - "glossary/**"
      - "ts/src/glossary/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  # ── Where the Linux `rust-ci` job runs ──────────────────────────────────
  #
  # On a run that is NOT a pull_request (coord's merge-candidate refs, through
  # candidate-ci.yml; main pushes; workflow_dispatch) this job decides whether
  # `rust-ci` runs on the self-hosted pool `[self-hosted, Linux, X64, ram-16g]`
  # or on the free GitHub-hosted `ubuntu-latest` floor. On 2026-11-03 the pool
  # is four repo-level registrations on nawa (`nawa-schemas-1..4`, 60 GiB
  # MemoryHigh units). Why: the org is on GitHub Free, about 20 concurrent
  # hosted jobs shared by every public repo's PR CI, and candidate CI queued
  # behind them (queue-wait p90 16.6 min, max 22.6, over ~12 merge-candidate
  # runs measured 2026-11-03, for a job that runs 3-7 min). pull_request runs
  # never reach the pool and skip this job: a fork PR must not run on a fleet
  # host (decision_record self-hosted-runners-on-public-repos), and a PR
  # backlog would saturate a pool sized for the train.
  #
  # The CALLER is checked as well as the event. publish-rust.yml calls this
  # workflow as the gate before a crates.io upload, and that run stays on the
  # hosted floor. So this job's `if:` and rust-ci's `runs-on` admit two
  # workflow files only: this one and candidate-ci.yml. In a called workflow
  # the github context belongs to the caller, so `github.workflow_ref` names
  # the CALLER's file: publish-rust.yml, and any caller added later, match
  # neither and stay hosted. The allow-list is spelled twice (here and in
  # rust-ci's `runs-on`); change both together.
  #
  # The decision is the fleet's route-with-a-hosted-floor router, a VERBATIM
  # copy of qontinui-claude-config `scripts/route-ci-lane.py` (blob c67b16e7).
  # Re-sync by copying the file again and checking `git hash-object` against
  # ccfg's blob; never edit it here. It reads THIS repo's queued jobs and
  # routes to the floor when the pool is STALLED (a pool job queued >= 10
  # min), SATURATED (>= 4 queued) or unreadable. The repo variable picks the
  # lane:
  #
  #   SCHEMAS_CI_LINUX_LANE = auto         this job runs and decides
  #                         = self-hosted  this job is SKIPPED; `rust-ci` goes
  #                                        to the pool unconditionally, with
  #                                        no overflow (a dead pool queues it
  #                                        until GitHub drops it at 24 h)
  #                         = hosted | unset | anything else
  #                                        this job is SKIPPED; `rust-ci` is
  #                                        hosted (the kill switch)
  #
  # RE-RUNS GO TO THE FLOOR, and rust-ci's `runs-on` decides that, not this
  # job. coord retries with "re-run failed jobs", which keeps a `route` that
  # succeeded, and a pool that picks jobs up and then fails them reads healthy
  # to the queue signal. So `runs-on` reads this job's labels on attempt 1
  # only, and this job is skipped on a re-run (it could only answer
  # "hosted", after queueing for a hosted runner to say so). A lane change
  # reaches runs created after it; to free a run stuck on a dead pool, cancel
  # it and re-run it (a re-run goes hosted).
  #
  # THE COST, under `auto` only: this job needs a hosted runner itself, so it
  # waits in the same hosted queue (seconds when hosted runners are free,
  # minutes when they are not). What `auto` buys is rust-ci's hosted runtime
  # moved off the shared pool, with the hosted floor whenever the pool is down
  # or full. `self-hosted` skips this job and its queue, and gives up the floor.
  #
  # PERMISSIONS: `contents: read` and nothing more, on purpose. A called
  # workflow's jobs may not exceed the caller's grant, GitHub checks that at
  # STARTUP even for a job whose `if:` can never fire, and this repo's default
  # token is read-only (`actions: none`). An `actions: read` here would turn
  # every candidate-ci.yml and publish-rust.yml run into a startup_failure
  # unless both callers granted it (qontinui-coord's candidate-ci.yml records
  # that outage). The router does not need it: this repo is public, and the
  # runs and jobs listings it reads are public resources, readable without
  # the permission. Should the repo go private and the listing be refused,
  # the router reports UNKNOWN and routes to the floor.
  #
  # The router always exits 0 with outputs written, and `rust-ci` runs under
  # `!cancelled()` with a hosted fallback, so a route job that fails, times
  # out or is skipped leaves rust-ci on the floor (or, forced, on the pool),
  # never SKIPPED, which coord's check classification would count as passing.
  route:
    if: ${{ github.run_attempt == 1 && github.event_name != 'pull_request' && vars.SCHEMAS_CI_LINUX_LANE == 'auto' && (contains(github.workflow_ref, '/.github/workflows/rust-ci.yml@') || contains(github.workflow_ref, '/.github/workflows/candidate-ci.yml@')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      labels: ${{ steps.route.outputs.labels }}
      lane: ${{ steps.route.outputs.lane }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Route the Linux rust-ci job
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_CALLER: ${{ github.workflow_ref }}
          ROUTE_EVENT: ${{ github.event_name }}
          SCHEMAS_CI_LINUX_LANE: ${{ vars.SCHEMAS_CI_LINUX_LANE }}
          SCHEMAS_CI_LINUX_LANE_SOURCE: repo variable SCHEMAS_CI_LINUX_LANE
          SCHEMAS_CI_LINUX_HOSTED_LABEL: ubuntu-latest
          SCHEMAS_CI_LINUX_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "caller ${ROUTE_CALLER}, event ${ROUTE_EVENT}, attempt ${SCHEMAS_CI_LINUX_RUN_ATTEMPT}"
          python3 -B .github/scripts/route-ci-lane.py \
            --self-hosted-labels self-hosted,Linux,X64,ram-16g \
            --env-prefix SCHEMAS_CI_LINUX \
            --title rust-ci \
            --default-lane hosted \
            --hosted-on-rerun

  rust-ci:
    # MIRRORED BY .qontinui/ci.toml — CHANGE BOTH IN THE SAME PR.
    #
    # This job's five gate commands (lock check / cargo fmt / clippy / build /
    # test) are
    # reproduced as argv arrays in .qontinui/ci.toml, the manifest the
    # runner-as-CI-node lane executes. That lane is how a dispatch validates a
    # SHA without GitHub Actions, and candidate-ci.yml calls THIS workflow and
    # nothing else — so the two lanes are supposed to agree on what a green head
    # means. Editing a command below without editing the manifest silently
    # breaks that agreement, and nothing in CI will tell you: the manifest is
    # read by the runner at dispatch time, never by this workflow.
    #
    # The manifest's header explains what it deliberately cannot mirror (the
    # check-drift / consumer-gate / commitlint / gitleaks jobs) and why, so a
    # reviewer can tell an intended gap from an oversight.
    #
    # `route` (above) decides where this job runs. `!cancelled()` is
    # load-bearing: on a pull_request `route` is SKIPPED, and a job that needs
    # a skipped job is skipped too, which would turn the required `rust-ci`
    # context into `skipped` (= passing to coord) on every PR.
    needs: route
    if: ${{ !cancelled() }}
    # The pool, on a FIRST attempt of a run that is not a pull_request and
    # whose caller is this file or candidate-ci.yml (the allow-list in
    # `route`'s `if:`), when the lane is forced `self-hosted` or `route` said
    # so under `auto` (its `labels` output). Everything else is the hosted
    # floor: a pull_request, any re-run, publish-rust.yml, the `hosted`/unset
    # lane, and a route job that produced nothing. The check name stays
    # `rust-ci` (`rust-ci / rust-ci` under candidate-ci.yml): it is the job
    # id, not the pool, and it is a required context. The pool label set is
    # spelled twice (here and in `route`'s --self-hosted-labels); change both
    # together.
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON((github.run_attempt == 1 && github.event_name != 'pull_request' && vars.SCHEMAS_CI_LINUX_LANE == 'self-hosted' && (contains(github.workflow_ref, '/.github/workflows/rust-ci.yml@') || contains(github.workflow_ref, '/.github/workflows/candidate-ci.yml@')) && '["self-hosted","Linux","X64","ram-16g"]') || (github.run_attempt == 1 && needs.route.outputs.labels) || '["ubuntu-latest"]') }}
    # A backstop for a hang: hosted runs take 3-7 min and a warm pool run about
    # 4, and on a four-registration pool one stuck job would otherwise hold a
    # quarter of it for the 360-min default.
    #
    # It must also contain every step bound below it, or a step that runs to
    # its own bound expires as a job timeout, which GitHub concludes
    # `cancelled`. The steps after `cargo test` that carry one sum to 12 min
    # (the extractor sentinel 1, setup-python 3, setup-node 3, the provisioning
    # env e2e 5). The adopting author read the job at 4.25-6.30 min hosted over
    # 9 runs and 3.92 on the pool over 1 (2026-11-03..06; run ids not kept), so
    # about 18.3 min at most, which leaves room for a cold cache. Re-measure
    # before tightening this cap.
    timeout-minutes: 30
    steps:
      # persist-credentials: false because no later step needs git auth, and
      # on the pool .git/config outlives the job in a home every registration
      # on the host shares.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # SELF-HOSTED ONLY (`route` put this job on the pool). What a hosted VM
      # hands every job and a persistent, shared host has to be told:
      #
      #   1. A HOME and TMPDIR of the job's own. Every registration on the host
      #      runs as ONE account with ONE home, so both move under $RUNNER_TEMP,
      #      which the runner empties per job. CARGO_HOME stays on the
      #      account's persistent registry cache, which cargo locks itself.
      #   2. A rustup of the registration's own. dtolnay/rust-toolchain below
      #      runs `rustup default <toolchain>`: on the account's shared
      #      RUSTUP_HOME that rewrites the default every other job on the host
      #      falls back to (it reads 1.95.0 on nawa), and an in-place `stable`
      #      update could swap the compiler under a concurrent job. One
      #      registration runs one job at a time, so a RUSTUP_HOME per
      #      registration has neither problem. It downloads `stable` once per
      #      registration and per release.
      #   3. A memory-derived compile cap. cargo's default parallelism is nproc
      #      (128 on nawa), a memory spike no unit cap survives.
      #      CARGO_BUILD_JOBS is the smallest of MemTotal and every cgroup
      #      memory.max/memory.high above this job, / 3 GiB, clamped to nproc.
      #      RUST_TEST_THREADS is 4, the hosted VM's own nproc, so the suite's
      #      concurrency regime does not change with the machine it lands on.
      #   4. A warm, persistent target. actions/checkout cleans with `git clean
      #      -ffdx`, which deletes ./target every job, so the target lives
      #      under the account's home, ONE per registration, and ./target is a
      #      symlink to it: the clean removes the link, never the tree behind
      #      it. `/target/` in .gitignore does not match a symlink, hence the
      #      info/exclude line. Bounded: over 40 GiB used, under 60 GiB free on
      #      its filesystem, or either reading unavailable, it starts cold.
      - name: "Self-hosted: job-local HOME, rustup, compile caps and the persistent target"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail

          state="$HOME/.cache/qontinui-schemas-ci/$RUNNER_NAME"
          job_home="$RUNNER_TEMP/home"
          mkdir -p "$state/rustup" "$job_home" "$RUNNER_TEMP/tmp"
          {
            echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
            echo "RUSTUP_HOME=$state/rustup"
            echo "HOME=$job_home"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
          } >> "$GITHUB_ENV"

          budget_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          cg="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          while [ "$cg" != "/sys/fs/cgroup" ] && [ -n "$cg" ]; do
            for f in memory.max memory.high; do
              v=$(cat "$cg/$f" 2>/dev/null || echo max)
              case "$v" in ''|*[!0-9]*) continue ;; esac
              if [ $((v / 1024)) -lt "$budget_kb" ]; then budget_kb=$((v / 1024)); fi
            done
            cg="${cg%/*}"
          done
          cpus=$(nproc)
          jobs=$(( budget_kb / 3145728 ))
          [ "$jobs" -ge 1 ] || jobs=1
          [ "$jobs" -le "$cpus" ] || jobs=$cpus
          threads=4
          [ "$threads" -le "$cpus" ] || threads=$cpus
          {
            echo "CARGO_BUILD_JOBS=$jobs"
            echo "RUST_TEST_THREADS=$threads"
          } >> "$GITHUB_ENV"
          echo "memory budget $((budget_kb / 1048576)) GiB, nproc $cpus -> CARGO_BUILD_JOBS=$jobs RUST_TEST_THREADS=$threads"

          cache="$state/target"
          mkdir -p "$cache"
          if ! used_kb=$(du -sk "$cache" 2>/dev/null | cut -f1) || [ -z "$used_kb" ]; then
            echo "::notice title=persistent target reset::du could not read $cache: starting cold"
            chmod -R u+rwX "${cache:?}" 2>/dev/null || true
            rm -rf "${cache:?}"
            mkdir -p "$cache"
            used_kb=0
          fi
          free_kb=$(df -Pk "$cache" 2>/dev/null | awk 'NR == 2 {print $4}') || true
          case "$free_kb" in ''|*[!0-9]*) free_kb=0 ;; esac
          if [ "$used_kb" -gt $((40 * 1048576)) ] || [ "$free_kb" -lt $((60 * 1048576)) ]; then
            echo "::notice title=persistent target reset::$((used_kb / 1048576)) GiB used, $((free_kb / 1048576)) GiB free on its filesystem: starting cold"
            chmod -R u+rwX "${cache:?}" 2>/dev/null || true
            rm -rf "${cache:?}"
            mkdir -p "$cache"
            used_kb=0
          fi
          if [ -e target ] && [ ! -L target ]; then rm -rf target; fi
          ln -sfn "$cache" target
          exclude="$(git rev-parse --git-path info/exclude)"
          mkdir -p "$(dirname "$exclude")"
          grep -qx '/target' "$exclude" 2>/dev/null || echo '/target' >> "$exclude"
          echo "target -> $cache ($((used_kb / 1048576)) GiB already built); RUSTUP_HOME -> $state/rustup"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Hosted only. A self-hosted job builds in its registration's persistent
      # target (above) and must never SAVE into this repo's GitHub cache: the
      # key carries the OS (`Linux-x64`) but not the distro, so an entry saved
      # on a Debian 13 pool host would be restored by the next hosted ubuntu
      # run, with build-script and proc-macro binaries linked against a newer
      # glibc than the hosted image's.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      # FIRST cargo command, deliberately. `cargo fmt`, `clippy` and `build`
      # each silently rewrite a stale Cargo.lock, after which `--locked` would
      # pass vacuously. Reproduced on a copy of main with rust/ at 2.0.0:
      # `--locked` exits 101, a plain `cargo metadata` rewrites 1.9.0 -> 2.0.0,
      # and `--locked` then exits 0. rust-cache's restore runs
      # `cargo metadata --no-deps`, which resolves nothing, so it rewrites
      # nothing.
      #
      # `cargo fetch --locked` rather than `cargo metadata --locked`: same
      # verdict (101 on a stale lock, 0 on a fresh one), but zero bytes of
      # stdout. The .qontinui/ci.toml mirror runs an argv array that cannot
      # redirect, and metadata's ~1.3 MB single-line JSON would land in the
      # runner's log stream. Do NOT add `--no-deps`: with `--locked` it exits 0
      # on a stale lock.
      #
      # This is what catches a release PR that forgot the root lock. That had
      # happened at every rust-v* tag until release-please's cargo-workspace
      # plugin (release-please-config.json) began regenerating the lock.
      # Plan: 2026-09-13-schemas-major-release-wedges-consumers, Phase 4.
      - name: Cargo.lock is up to date
        run: cargo fetch --locked

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --features qontinui-ci-exec/import,qontinui-types/host-probe -- -D warnings

      # The library as its consumers (runner, coord) build it: WITHOUT the
      # `import` feature, so dead code behind the feature gate is caught.
      - name: cargo clippy ci-exec without the import feature
        run: cargo clippy -p qontinui-ci-exec --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets --features qontinui-ci-exec/import,qontinui-types/host-probe

      # The vacuity parser below is a COPY. Its source of record is
      # qontinui-claude-config/scripts/lib/cargo-vacuity.sh, which this runner
      # cannot reach, so the copy carries the source block's digest in its own
      # header and this step asserts the file still matches it. That catches
      # in-repo tampering; drift FROM the source is caught by
      # qontinui-claude-config's lint-cargo-verification-form.py wherever both
      # repos are checked out together. Neither half alone is a cross-repo gate,
      # and saying so is the point — plan
      # 2026-09-06-cross-repo-transcription-drift-has-no-ci-gate owns the general
      # mechanism. Plan 2026-09-06-rust-verification-green-but-vacuous, Phase 4.
      - name: The vacuity parser copy matches its declared digest
        run: |
          F=.github/scripts/cargo-vacuity-count.awk
          WANT=$(sed -n 's/^# source-sha256:[[:space:]]*//p' "$F" | head -1)
          [ -n "$WANT" ] || { echo "::error::$F carries no source-sha256 header"; exit 1; }
          GOT=$(awk '/^# >>> CARGO_VACUITY_AWK /{f=1;next} /^# <<< CARGO_VACUITY_AWK /{f=0} f' "$F" | sha256sum | cut -d" " -f1)
          echo "vacuity parser: declared ${WANT}, computed ${GOT}"
          [ "$WANT" = "$GOT" ] || { echo "::error::$F has been edited in place. Re-copy the block from qontinui-claude-config/scripts/lib/cargo-vacuity.sh and restamp the digest."; exit 1; }

      - name: cargo test
        run: |
          # Correct target selection (--workspace), no floor until now: a lost
          # --workspace, or a member dropping out of the workspace, collapses
          # this to a fraction and still exits 0. Measured 2026-09-06: 887 tests
          # across 15 crate targets (re-measured below for the target floor).
          set +e
          # --features qontinui-ci-exec/import: the `qontinui-ci` binary, the
          # workflow importer/generator and their golden tests sit behind that
          # non-default feature (library consumers do not pull in libyaml).
          # qontinui-types/host-probe: `host_sizing::probe` and its test sit
          # behind that non-default feature (it pulls in sysinfo).
          # The output goes to $RUNNER_TEMP, which the runner empties per job
          # on either lane; a self-hosted registration keeps /tmp between jobs.
          cargo test --workspace --features qontinui-ci-exec/import,qontinui-types/host-probe 2>&1 | tee "$RUNNER_TEMP/cargo-test.out"
          SUBRC=${PIPESTATUS[0]}
          set -e

          # ── TEST-COUNT FLOOR ────────────────────────────────────────────
          # Plan 2026-09-06-rust-verification-green-but-vacuous, Phase 4.
          # A target-selection change can collapse this suite to a handful of
          # tests while the step still exits 0 and prints a plausible summary.
          # The floor is the only thing that sees that, and it is committed so
          # that LOWERING it shows up in a diff.
          #
          # The parser is `awk -f`, from a file this repo commits, because the
          # source of record lives in qontinui-claude-config and this runner
          # never checks it out. `awk` always exits 0 and always prints a
          # number; a `grep` here would exit non-zero on no match and, under
          # this shell's `pipefail`, abort the step in exactly the zero-tests
          # case the guard exists for.
          VACUITY=$(awk -f .github/scripts/cargo-vacuity-count.awk "$RUNNER_TEMP/cargo-test.out")
          RAN=${VACUITY%% *}
          SUMMARIES=${VACUITY##* }
          MIN_TESTS=500

          # ── CRATE-TARGET FLOOR ──────────────────────────────────────────
          # SUMMARIES is the number of crate targets that printed a summary,
          # and the test floor above cannot see it shrink: a fail-fast abort
          # after the biggest targets, or a selection that keeps them and drops
          # the rest, still clears 500 tests. Measured on run 36449139416
          # (main 02fdbb97, 2026-09-29): 940 tests across 18 targets (15 on
          # 2026-09-06); the floor is half, the same ratio as the test floor.
          # Plan
          # 2026-09-20-rust-verification-residuals-cached-green-straddles-the-edit-target-count-unfloored-and-source-pins-scan-themselves,
          # Phase 3.
          MIN_TARGETS=9

          # ── A RED RUN IS STILL A READING ────────────────────────────────
          # Both floors are evaluated whatever cargo exited, and both facts are
          # printed, so a red run's log says how much of the suite it reached
          # rather than stopping at cargo's first error. A failing floor exits
          # with cargo's own status when that was already non-zero, so the
          # step's exit code is never laundered into a different one; and no
          # line here calls a red run's reading a pass.
          FAIL_RC=${SUBRC}
          [ "${FAIL_RC}" -ne 0 ] || FAIL_RC=1
          echo "schemas cargo test --workspace: cargo exited ${SUBRC}; ${RAN} tests ran across ${SUMMARIES} summary line(s)" \
               "(floors: ${MIN_TESTS} tests, ${MIN_TARGETS} crate targets)"
          if [ "${SUMMARIES}" -eq 0 ]; then
            echo "::error::No test summary of either format was found in this run's output." \
                 "The command exited ${SUBRC} but produced no evidence that any test executed." \
                 "That is UNKNOWN, not a pass."
            exit "${FAIL_RC}"
          fi
          if [ "${SUBRC}" -eq 0 ]; then
            WHY="cargo exited 0, so this is a collapse, not a crash"
          else
            WHY="cargo exited ${SUBRC}, so the run is RED and stopped early; cargo's own error above is the cause, and this line records how much of the suite that run reached"
          fi
          FLOOR_MISSED=0
          if [ "${RAN}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Only ${RAN} tests ran (floor ${MIN_TESTS}). ${WHY}." \
                 "On a green exit it is almost certainly a target-selection change rather than" \
                 "deleted tests. Do NOT lower the floor to make this pass."
            FLOOR_MISSED=1
          fi
          if [ "${SUMMARIES}" -lt "${MIN_TARGETS}" ]; then
            echo "::error::Only ${SUMMARIES} of the suite's crate targets reported a summary" \
                 "(floor ${MIN_TARGETS}). ${WHY}. Fewer targets than the floor is a fail-fast" \
                 "abort or a target-selection collapse. Do NOT lower the floor."
            FLOOR_MISSED=1
          fi
          if [ "${FLOOR_MISSED}" -ne 0 ]; then
            exit "${FAIL_RC}"
          fi
          if [ "${SUBRC}" -ne 0 ]; then
            echo "::error::cargo test exited ${SUBRC}: this run is RED. It reached ${RAN} tests" \
                 "across ${SUMMARIES} crate targets, at or above both floors — which says how much" \
                 "of the suite ran, never that it passed. cargo's own error above is the cause."
          fi
          exit "${SUBRC}"

      - name: ci-exec's Unix extractor tests ran on this leg
        # The three tests below are the regression tests for the node-tree
        # extractor's arbitrary-write bug. Their `#[cfg(unix)]` arms are the
        # ones that discriminate, and they are the arms a Linux CI-node host
        # runs. This is the only Linux job that runs ci-exec's lib tests
        # (rust-ci is the only workflow carrying `cargo test`), so a rename, a
        # filter or a cfg that drops one would leave `cargo test` green while
        # the arm ran nowhere. The step reads the log the step above wrote
        # (no cargo) and fails unless each one printed `... ok` inside the
        # ci-exec lib test binary's own section of it. Plan
        # 2026-11-06-ci-node-provisioning-children-inherit-only-an-allowlisted-environment,
        # Phase 4.
        #
        # NOT mirrored in .qontinui/ci.toml: it reads a log file that only the
        # Actions step above writes.
        timeout-minutes: 1
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/cargo-test.out"
          SECTION="$RUNNER_TEMP/ci-exec-lib-tests.out"
          if [ ! -s "$OUT" ]; then
            echo "::error::$OUT is missing or empty, so whether ci-exec's Unix extractor tests ran is UNKNOWN, not a pass."
            exit 1
          fi
          # The lib test binary's section runs from its `Running unittests
          # src/lib.rs (...qontinui_ci_exec-<hash>)` line to the next `Running`
          # or `Doc-tests` line. Colour codes go first: dtolnay/rust-toolchain
          # exports CARGO_TERM_COLOR=always.
          awk '
            { gsub(/\033\[[0-9;]*[a-zA-Z]/, "") }
            /^[[:space:]]*(Running|Doc-tests)[[:space:]]/ {
              inside = ($0 ~ /Running unittests src\/lib\.rs \([^)]*\/qontinui_ci_exec-[0-9a-f]+\)/)
              next
            }
            inside { sub(/[[:space:]]+$/, ""); print }
          ' "$OUT" > "$SECTION"
          MISSING=0
          for TEST in \
            tools::tests::two_link_chain_cannot_escape_the_extraction_root \
            tools::tests::no_symlink_is_ever_created_under_the_destination \
            tools::tests::a_contained_link_chain_materialises
          do
            if grep -Fqx "test $TEST ... ok" "$SECTION"; then
              echo "ran: test $TEST ... ok"
            else
              echo "::error::ci-exec's $TEST did not print '... ok' in this leg's cargo test output. Its #[cfg(unix)] arm runs in no other Linux job that runs cargo test; dropping it has to be a decision, not an accident."
              MISSING=1
            fi
          done
          exit "$MISSING"

      - name: fleet-nouns.toml patterns agree across Rust, Python and JS
        # fleet-nouns.toml promises one meaning per pattern under Rust `regex`,
        # Python `re` and JS `new RegExp(p)`, because its consumer lints are
        # written in all three. The Rust test can only run Rust's engine, so it
        # writes its hit matrix and this step re-evaluates every text in the file
        # (examples, literals, look-alikes, product constants, non-ASCII probes)
        # under python3 and node — both preinstalled on ubuntu-latest and on the
        # self-hosted pool — and fails on any disagreement. The matrix goes to
        # $RUNNER_TEMP, emptied per job: in a /tmp a registration keeps between
        # jobs, a test that stopped writing it would leave the last job's
        # matrix for the check below to pass on.
        run: |
          FLEET_NOUNS_MATRIX_OUT="$RUNNER_TEMP/fleet-nouns-rust.json" \
            cargo test -p qontinui-types --test fleet_nouns_vocabulary \
            hit_matrix_for_the_cross_engine_check
          python3 .github/scripts/fleet-nouns-portability.py "$RUNNER_TEMP/fleet-nouns-rust.json"

      # ── Provisioning env e2e (Linux leg; ci-exec-windows is the other) ─────
      #
      # The hermetic proof that a CI-node provisioning child (an installer, or
      # the `--version` run that verifies an installed tool) sees only the
      # allowlisted environment, never the host's credentials. The test
      # provisions a probe distribution through the real `tools::provision`
      # and asserts on the names its verify child recorded. Plan
      # 2026-11-06-ci-node-provisioning-children-inherit-only-an-allowlisted-environment,
      # Phase 3.
      #
      # These steps come AFTER every step that runs python3 or node, because
      # both setup actions change what later steps resolve (setup-python also
      # exports LD_LIBRARY_PATH and PKG_CONFIG_PATH on Linux).
      #
      # Hosted only, for now. The self-hosted pool runs them once a run there
      # is measured capable (the plan's Phase 1.3); until then it stays
      # UNKNOWN, and it loses only the re-run on main and on merge candidates.
      # Every pull request takes the hosted floor, so a PR's own run always
      # exercises them.
      #
      # NOT mirrored in .qontinui/ci.toml: the test needs a host Python 3 with
      # `venv`, which the CI-node lane never installs (`no_python_refusal` in
      # ci-exec/src/tools.rs), plus the setup-python and setup-node actions.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        timeout-minutes: 3
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        if: runner.environment == 'github-hosted'
        timeout-minutes: 3
        with:
          node-version: "22"

      - name: Provisioning env e2e
        if: runner.environment == 'github-hosted'
        timeout-minutes: 5
        shell: bash
        env:
          # The two canaries. The test fails unless both are in its own
          # environment, and fails if either reaches the verify child. The
          # proxy is a closed loopback port, harmless under the probe's
          # `--no-index`.
          HTTPS_PROXY: http://127.0.0.1:9
          QONTINUI_E2E_CANARY_PASSWORD: canary-not-a-credential
        run: |
          # NO CARGO HERE. setup-python changed PATH, LD_LIBRARY_PATH and
          # PKG_CONFIG_PATH, and the dependency graph carries cc/cmake/
          # pkg-config build scripts, so a second cargo invocation could
          # rebuild inside this job's cap. Run the ci-exec lib test binary the
          # `cargo test` step built, recovered from its log by the script both
          # lanes share.
          BIN=$(awk -f .github/scripts/ci-exec-lib-test-binary.awk "$RUNNER_TEMP/cargo-test.out")
          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            echo "::error::found no runnable ci-exec lib test binary in $RUNNER_TEMP/cargo-test.out, so the e2e did not run. That is UNKNOWN, not a pass."
            exit 1
          fi
          BIN="$(cd "$(dirname "$BIN")" && pwd)/$(basename "$BIN")"
          # cargo runs a unit-test binary from its package directory, and so
          # does this step. `--show-output` prints the names the verify child
          # saw (names only, never values): that line is the measurement.
          cd ci-exec
          "$BIN" --ignored --exact --show-output \
            child_env::tests::provisioning_children_see_only_allowlisted_names \
            2>&1 | tee "$RUNNER_TEMP/provisioning-env-e2e.out"
          # `--exact` on a renamed test matches nothing, and libtest exits 0 on
          # `0 passed`, so the one pass has to show.
          if ! grep -q 'test result: ok\. 1 passed' "$RUNNER_TEMP/provisioning-env-e2e.out"; then
            echo "::error::the provisioning env e2e did not report exactly one passing test. A renamed test runs nothing; that is UNKNOWN, not a pass."
            exit 1
          fi

  ci-exec-windows:
    # The CI executor (ci-exec) runs on Windows CI nodes too — the runner's
    # desktop lane is mostly Windows — and its tests carry Windows-only arms
    # (the `cmd.exe /C` shim fallback, drive-letter path gates, `.exe` tool
    # resolution). Before the executor moved here those tests ran on the
    # runner's windows-latest leg; this job keeps that coverage.
    #
    # NOT mirrored in .qontinui/ci.toml: that manifest is v1, whose one job
    # runs on any OS, so it cannot pin a Windows leg. A v2 `os = "windows"`
    # job can, once this repo's manifest moves to v2. The provisioning env e2e
    # below is not mirrored for that reason and for rust-ci's.
    runs-on: windows-latest
    # A hung cargo would otherwise run to the 360-min default. The new steps
    # below carry their own bounds (setup-python 3, setup-node 3, the e2e 5);
    # this cap contains them plus the build and test run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test -p qontinui-ci-exec --features import
        # Teed to a file so the provisioning env e2e below runs the lib test
        # binary this step built instead of invoking cargo again. bash runs
        # with `-eo pipefail`, so cargo's own status still decides the step.
        shell: bash
        run: cargo test --locked -p qontinui-ci-exec --features import 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/cargo-test.out"

      # The provisioning env e2e's Windows leg; rust-ci's copy says what it
      # proves. Windows is where the allowlist has the most to get right
      # (SystemRoot, APPDATA, LOCALAPPDATA, ComSpec, PATHEXT, compared
      # case-insensitively), and the leg has no pool, so it always runs.
      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        timeout-minutes: 3
        with:
          node-version: "22"

      - name: Provisioning env e2e
        timeout-minutes: 5
        shell: bash
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          QONTINUI_E2E_CANARY_PASSWORD: canary-not-a-credential
        run: |
          # NO CARGO HERE, as in rust-ci: run the binary the step above built.
          # Its log spells the path with backslashes, which the shared script
          # turns around.
          TMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          BIN=$(awk -f .github/scripts/ci-exec-lib-test-binary.awk "$TMP_DIR/cargo-test.out")
          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
            echo "::error::found no ci-exec lib test binary in $TMP_DIR/cargo-test.out, so the e2e did not run. That is UNKNOWN, not a pass."
            exit 1
          fi
          BIN="$(cd "$(dirname "$BIN")" && pwd)/$(basename "$BIN")"
          cd ci-exec
          "$BIN" --ignored --exact --show-output \
            child_env::tests::provisioning_children_see_only_allowlisted_names \
            2>&1 | tee "$TMP_DIR/provisioning-env-e2e.out"
          if ! grep -q 'test result: ok\. 1 passed' "$TMP_DIR/provisioning-env-e2e.out"; then
            echo "::error::the provisioning env e2e did not report exactly one passing test. A renamed test runs nothing; that is UNKNOWN, not a pass."
            exit 1
          fi
