[package]
name = "qontinui-types"
version = "4.8.0"
description = "Canonical DTO types for Qontinui. Rust is the source of truth; TypeScript and Python are generated from JSON Schema emitted by schemars."
edition.workspace = true
license.workspace = true
repository.workspace = true
# These repo tests read files outside this package (../fleet-nouns.toml,
# ../glossary/terms.toml); shipped in the .crate they could only fail.
exclude = [
  "tests/fleet_nouns_vocabulary.rs",
  "tests/glossary_source.rs",
  "tests/refusal_render.rs",
  "examples/refusal_render_fixtures.rs",
  "tests/common/**",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
html-escape = "0.2"
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
serde_jcs = "0.1"
thiserror = "2"
base64 = "0.22"
# Optional: only `host_sizing::probe` reads the live host. Enable with the
# `host-probe` feature; the pure sizing arithmetic needs nothing.
sysinfo = { version = "0.32", default-features = false, features = ["system"], optional = true }
# Optional: only `spec_model::{parse, render}` read and write YAML frontmatter.
# Enable with the `spec-yaml` feature; the spec types themselves need nothing,
# so a consumer that only uses them adds nothing to its lockfile.
serde_yaml_ng = { version = "0.10", optional = true }

[features]
default = []
# `host_sizing::probe` — read the host's memory (sysinfo) and parallelism.
# Consumers that size builds against the live host (runner, supervisor)
# enable this; the rest of the crate never touches the host.
host-probe = ["dep:sysinfo"]
# `spec_model::{parse, render}` — the spec artifact body as YAML frontmatter
# plus prose. Consumers that read or write whole spec bodies enable this.
spec-yaml = ["dep:serde_yaml_ng"]

[dev-dependencies]
# tests/fleet_nouns_vocabulary.rs — validates the repo-root fleet-nouns.toml.
regex = "1"
toml = "1"
# tests/image_slot_fixtures.rs — image-slot specs are authored as YAML. The
# maintained fork of the deprecated serde_yaml, already locked here by ci-exec.
serde_yaml_ng = "0.10"
