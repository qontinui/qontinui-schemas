[package]
name = "qontinui-vision-core"
version = "0.1.3"
description = "Image pipeline + output contract for Qontinui's vision surface. Composable stages producing bytes that satisfy a declared model-vision contract (e.g., Claude vision)."
edition.workspace = true
license = "MIT"  # the rest of the workspace is AGPL-3.0-or-later; see LICENSE in this directory
repository.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema for the Observation envelope, which qontinui-runner's
# `export_schemas` registry emits into the generated TS/Python bindings.
# `chrono04` gives `DateTime<Utc>` its `date-time` string schema.
schemars = { version = "1", features = ["chrono04"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
tempfile = "3"

# Standalone analyzer CLI — a hermetic, version-pinned wrapper over this
# crate's analyzer + assertion API, runnable in CI WITHOUT a qontinui-runner
# process. The runner's `/vision/*` HTTP endpoints remain a parallel consumer
# of the same library code.
[[bin]]
name = "vision-audit"
path = "src/bin/vision_audit.rs"
