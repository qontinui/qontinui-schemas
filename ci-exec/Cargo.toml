[package]
name = "qontinui-ci-exec"
version = "0.1.0"
description = "The Qontinui CI executor: reads a repo's .qontinui/ci.toml, provisions its tools, siblings and services, and runs one job. Shared by the runner's CI node, the headless CI host agent and the standalone qontinui-ci CLI."
edition.workspace = true
license.workspace = true
repository.workspace = true
# Consumed through path dependencies (qontinui-runner, qontinui-coord); not
# published to crates.io.
publish = false

[lib]
name = "qontinui_ci_exec"

[[bin]]
name = "qontinui-ci"
path = "src/bin/qontinui_ci/main.rs"

[dependencies]
bytes = "1"
flate2 = "1"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GitHub workflow YAML for `qontinui-ci import`. serde_yaml itself is
# deprecated upstream; this is its maintained continuation.
serde_yaml_ng = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
zip = "8"

[target.'cfg(unix)'.dependencies]
# killpg for the standalone host's child-tree reaper.
libc = "0.2"

[dev-dependencies]
filetime = "0.2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time", "test-util"] }
