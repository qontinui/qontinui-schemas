version = 2

[[tools]]
name = "node"
version = "22.11.0"

[[jobs]]
# from ci-integrity-selftest.yml › guard-tests ("CI-integrity guard tests")
name = "guard-tests"
os = "linux"

[[jobs.steps]]
# from step "Shell decision logic (real run-block, stubbed gh)"
name = "Shell decision logic (real run-block, stubbed gh)"
command = ["bash", "scripts/tests/ci-integrity/run-scenarios.sh"]
timeout_secs = 300

[[jobs.steps]]
# from step "Surface differ (surface / digest / alias refusal)"
name = "Surface differ (surface / digest / alias refusal)"
command = ["python3", "scripts/tests/ci-integrity/test-surface.py"]
timeout_secs = 300

[[jobs]]
# from ci.yml › lint-and-test
name = "lint-and-test"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["npm", "ci"]

[[jobs.steps]]
# from step "Diagnostics drift check"
name = "Diagnostics drift check"
command = ["npm", "run", "diagnostics:check"]

[[jobs.steps]]
# from step "Redaction surface ratchet"
name = "Redaction surface ratchet"
command = ["npm", "run", "redaction:check-surface"]

[[jobs.steps]]
# from step "Dependency range ratchet"
name = "Dependency range ratchet"
command = ["npm", "run", "deps:check-ranges"]

[[jobs.steps]]
# from step "Documentation symbol ratchet self-test"
name = "Documentation symbol ratchet self-test"
command = ["npm", "run", "docs:check-symbols:test"]

[[jobs.steps]]
# from step "Documentation symbol ratchet"
name = "Documentation symbol ratchet"
command = ["npm", "run", "docs:check-symbols"]

[[jobs.steps]]
# from step "CI manifest ratchet"
name = "CI manifest ratchet"
command = ["npm", "run", "ci:check-manifest"]

[[jobs.steps]]
# from step "Lint"
name = "Lint"
command = ["npm", "run", "lint"]

[[jobs.steps]]
# from step "Build"
name = "Build"
command = ["npm", "run", "build"]

[[jobs.steps]]
# from step "Build again (order-independence guard)"
name = "Build again (order-independence guard)"
command = ["npm", "run", "build"]

[[jobs.steps]]
# from step "Type check"
name = "Type check"
command = ["npm", "run", "typecheck"]

[[jobs.steps]]
# from step "Test"
name = "Test"
command = ["npm", "run", "test"]

[[jobs]]
# from ci.yml › python-tests
name = "python-tests"
os = "linux"

[[jobs.steps]]
# from step "Lint with ruff"
name = "Lint with ruff"
command = ["ruff", "check", "."]
working_dir = "packages/ui-bridge-python"

[[jobs.steps]]
# from step "Type check with mypy"
name = "Type check with mypy"
command = ["mypy", "ui_bridge"]
working_dir = "packages/ui-bridge-python"

[[jobs.steps]]
# from step "Test with pytest"
name = "Test with pytest"
command = ["pytest"]
working_dir = "packages/ui-bridge-python"

[[jobs]]
# from ci.yml › docs
name = "docs"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["npm", "ci"]
working_dir = "docs-site"

[[jobs.steps]]
# from step "Build documentation"
name = "Build documentation"
command = ["npm", "run", "build"]
working_dir = "docs-site"

[[jobs]]
# from dependency-twin-resolver.yml › resolve
name = "resolve"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["node", "--version"]

[[jobs.steps]]
# from step "Run dependency twin resolver"
name = "Run dependency twin resolver"
command = ["node", "scripts/dependency-twin-resolver.mjs"]

[[jobs]]
# from docs.yml › build
name = "docs-build"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["npm", "ci"]
working_dir = "docs-site"

[[jobs.steps]]
# from step "Build documentation"
name = "Build documentation"
command = ["npm", "run", "build"]
working_dir = "docs-site"

[[jobs]]
# from qontinui-ci.yml › build
name = "qontinui-ci-build"
os = "linux"

[[jobs.steps]]
# from step "Redaction surface ratchet"
name = "Redaction surface ratchet"
command = ["npm", "run", "redaction:check-surface", "--if-present"]

[[jobs.steps]]
# from step "Lint"
name = "Lint"
command = ["npm", "run", "lint", "--if-present"]

[[jobs.steps]]
# from step "Build"
name = "Build"
command = ["npm", "run", "build", "--if-present"]

[[jobs.steps]]
# from step "Test"
name = "Test"
command = ["npm", "test", "--if-present"]

[[jobs]]
# from runner-contract.yml › contract ("SDK <-> runner route contract")
name = "contract"
os = "linux"

[[jobs.steps]]
# from step "Provenance unit tests"
name = "Provenance unit tests"
command = ["node", "scripts/check-runner-contract.test.mjs"]

[[jobs]]
# from smoke-test.yml › lint-smoke-script ("Lint smoke-test script")
name = "lint-smoke-script"
os = "linux"

[[jobs.steps]]
# from step "Bash syntax check"
name = "Bash syntax check"
command = ["bash", "-n", "scripts/smoke-test-runner.sh"]
