version = 2

[[siblings]]
repo = "qontinui/qontinui-runner"

[[siblings]]
repo = "qontinui/qontinui-schemas"

[[jobs]]
# from qontinui-ci.yml › build
name = "build"
os = "linux"

[[jobs.steps]]
# from step "Format"
name = "Format"
command = ["cargo", "fmt", "-p", "qontinui-inspect", "--", "--check"]
timeout_secs = 7200

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Clippy"
name = "Clippy"
command = ["cargo", "clippy", "-p", "qontinui-inspect", "--all-targets", "--", "-D", "warnings"]
timeout_secs = 7200

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Check"
name = "Check"
command = ["cargo", "check", "-p", "qontinui-inspect", "--all-targets"]
timeout_secs = 7200

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Test"
name = "Test"
command = ["cargo", "test", "-p", "qontinui-inspect"]
timeout_secs = 7200

[jobs.steps.env]
CARGO_TERM_COLOR = "always"
