version = 2

[[siblings]]
repo = "qontinui/qontinui-web"

[[tools]]
name = "node"
version = "22.11.0"

[[jobs]]
# from boundary-guard.yml › no-coord-import
name = "no-coord-import"
os = "linux"

[[jobs.steps]]
# from step "cloud-control must not import qontinui-coord source"
name = "cloud-control must not import qontinui-coord source"
command = ["python3", "scripts/check_no_coord_import.py"]

[[jobs]]
# from ci.yml › repo-checks ("Repo checks (stdlib only)")
name = "repo-checks"
os = "linux"

[[jobs.steps]]
# from step "frontend relative imports resolve"
name = "frontend relative imports resolve"
command = ["python3", "scripts/check_frontend_imports.py"]

[[jobs.steps]]
# from step "gate self-tests"
name = "gate self-tests"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_*.py", "-v"]

[[jobs]]
# from ci.yml › python-lint ("Lint & type-check")
name = "python-lint"
os = "linux"

[[jobs.steps]]
# from step "Run ruff (linting)"
name = "Run ruff (linting)"
command = ["ruff", "check", "backend/", "scripts/"]

[[jobs.steps]]
# from step "Run ruff format (formatting)"
name = "Run ruff format (formatting)"
command = ["ruff", "format", "--check", "backend/", "scripts/"]

[[jobs.steps]]
# from step "Run mypy (type checking)"
name = "Run mypy (type checking)"
command = ["mypy", "backend/qontinui_cloud_control", "scripts"]
