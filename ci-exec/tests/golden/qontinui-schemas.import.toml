version = 2

[[jobs]]
# from release-pr-sanity.yml › release-pr-sanity
name = "release-pr-sanity"
os = "linux"

[[jobs.steps]]
# from step "Every base manifest version has a release"
name = "Every base manifest version has a release"
command = ["bash", ".github/scripts/release-pr-sanity.sh"]

[[jobs]]
# from rust-ci.yml › rust-ci
name = "rust-ci-rust-ci"
os = "linux"

[[jobs.steps]]
# from step "Cargo.lock is up to date"
name = "Cargo.lock is up to date"
command = ["cargo", "fetch", "--locked"]

[[jobs.steps]]
# from step "cargo fmt --check"
name = "cargo fmt --check"
command = ["cargo", "fmt", "--all", "--", "--check"]

[[jobs.steps]]
# from step "cargo clippy"
name = "cargo clippy"
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[[jobs.steps]]
# from step "cargo build"
name = "cargo build"
command = ["cargo", "build", "--workspace", "--all-targets"]

[[jobs.steps]]
# from step "fleet-nouns.toml patterns agree across Rust, Python and JS"
name = "fleet-nouns.toml patterns agree across Rust, Python and JS (1/2)"
command = ["cargo", "test", "-p", "qontinui-types", "--test", "fleet_nouns_vocabulary", "hit_matrix_for_the_cross_engine_check"]

[[jobs.steps]]
# from step "fleet-nouns.toml patterns agree across Rust, Python and JS"
name = "fleet-nouns.toml patterns agree across Rust, Python and JS (2/2)"
command = ["python3", ".github/scripts/fleet-nouns-portability.py", "/tmp/fleet-nouns-rust.json"]

[[jobs]]
# from schema-drift.yml › check-drift
name = "check-drift"
os = "linux"

[[jobs.steps]]
# from step "Install qontinui-schemas npm deps"
name = "Install qontinui-schemas npm deps"
command = ["npm", "install"]

[[jobs.steps]]
# from step "Preflight — codegen toolchain present"
name = "Preflight — codegen toolchain present"
command = ["bash", "scripts/check-generated-drift.sh", "--preflight"]

[[jobs.steps]]
# from step "Check for drift"
name = "Check for drift"
command = ["bash", "scripts/check-generated-drift.sh", "--verify"]

[[jobs]]
# from ts-typecheck.yml › typecheck
name = "typecheck"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["npm", "ci"]
working_dir = "ts"

[[jobs.steps]]
# from step "Type-check (source + generated .d.ts gate)"
name = "Type-check (source + generated .d.ts gate)"
command = ["npm", "run", "typecheck"]
working_dir = "ts"

[[jobs.steps]]
# from step "Unit tests"
name = "Unit tests"
command = ["npm", "test"]
working_dir = "ts"
