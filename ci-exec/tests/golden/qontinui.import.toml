version = 2

[[siblings]]
repo = "qontinui/qontinui-schemas"

[[siblings]]
repo = "qontinui/multistate"

[[jobs]]
# from ci.yml › lint
name = "lint"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["poetry", "install", "--no-interaction", "--no-ansi"]

[[jobs.steps]]
# from step "Run linting"
name = "Run linting"
command = ["poetry", "run", "ruff", "check", "."]

[[jobs]]
# from ci.yml › typecheck
name = "typecheck"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["poetry", "install", "--no-interaction", "--no-ansi"]

[[jobs.steps]]
# from step "Run type checking"
name = "Run type checking"
command = ["poetry", "run", "mypy", "src/qontinui", "--ignore-missing-imports"]

[[jobs]]
# from ci.yml › tests
name = "tests"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["poetry", "install", "--no-interaction", "--no-ansi"]

[[jobs.steps]]
# from step "Install Playwright browsers"
name = "Install Playwright browsers"
command = ["poetry", "run", "playwright", "install", "--with-deps", "chromium"]

[[jobs.steps]]
# from step "Run tests with coverage"
name = "Run tests with coverage"
command = ["xvfb-run", "-a", "poetry", "run", "pytest", "--cov=src/qontinui", "--cov-report=xml", "--cov-report=term"]

[[jobs]]
# from ci.yml › tests-ml
name = "tests-ml"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies (with ml extra)"
name = "Install dependencies (with ml extra)"
command = ["poetry", "install", "--no-interaction", "--no-ansi", "--extras", "ml"]

[[jobs.steps]]
# from step "Install Playwright browsers"
name = "Install Playwright browsers"
command = ["poetry", "run", "playwright", "install", "--with-deps", "chromium"]

[[jobs.steps]]
# from step "Run tests"
name = "Run tests"
command = ["xvfb-run", "-a", "poetry", "run", "pytest"]

[[jobs]]
# from ci.yml › build
name = "build"
os = "linux"
needs = ["tests"]

[[jobs.steps]]
# from step "Build package"
name = "Build package"
command = ["poetry", "build"]
