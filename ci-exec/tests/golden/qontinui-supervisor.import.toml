version = 2

[[siblings]]
repo = "qontinui/qontinui-runner"

[[jobs]]
# from ci.yml › rust-check ("Rust Check")
name = "rust-check"
os = "linux"

[[jobs.steps]]
# from step "Checkout sibling repos"
name = "Checkout sibling repos"
command = ["bash", ".github/scripts/schemas-pin.sh", "checkout", "./.."]

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Pinned qontinui-schemas commit is on schemas main"
name = "Pinned qontinui-schemas commit is on schemas main"
command = ["bash", ".github/scripts/schemas-pin.sh", "verify-landed"]
timeout_secs = 300

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Check formatting"
name = "Check formatting"
command = ["cargo", "fmt", "--check"]

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Run clippy"
name = "Run clippy"
command = ["cargo", "clippy", "--", "-D", "warnings"]

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Build"
name = "Build"
command = ["cargo", "build"]

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs]]
# from ci.yml › ci-scripts-tests ("CI script tests")
name = "ci-scripts-tests"
os = "linux"

[[jobs.steps]]
# from step "Schemas sibling pin tests"
name = "Schemas sibling pin tests"
command = ["bash", ".github/scripts/test-schemas-pin.sh"]
timeout_secs = 300

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs]]
# from ci.yml › compose-parity ("Compose Parity (cross-repo fixture drift)")
name = "compose-parity"
os = "linux"

[[jobs.steps]]
# from step "Checkout sibling repos"
name = "Checkout sibling repos"
command = ["bash", ".github/scripts/schemas-pin.sh", "checkout", "./.."]

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs]]
# from ci.yml › frontend-check ("Frontend Check")
name = "frontend-check"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["npm", "ci"]
working_dir = "frontend"

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "TypeScript type check"
name = "TypeScript type check"
command = ["npx", "tsc", "--noEmit"]
working_dir = "frontend"

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Build"
name = "Build"
command = ["npm", "run", "build"]
working_dir = "frontend"

[jobs.steps.env]
CARGO_TERM_COLOR = "always"
