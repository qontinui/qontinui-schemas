version = 2

[[siblings]]
repo = "qontinui/qontinui-web"

[[siblings]]
repo = "qontinui/qontinui"

[[siblings]]
repo = "qontinui/ui-bridge"

[[jobs]]
# from advisory-red-detector.yml › selftest ("schedule-red-streak detector selftest")
name = "advisory-red-detector-selftest"
os = "linux"

[[jobs.steps]]
# from step "Test the schedule-red-streak detector (fixtures, no network)"
name = "Test the schedule-red-streak detector (fixtures, no network)"
command = ["bash", "scripts/tests/test_schedule_red_streak_detector.sh"]
timeout_secs = 300

[[jobs]]
# from atlas-schema-check.yml › check
name = "check"
os = "linux"

[[jobs.services]]
name = "postgres-pgvector"
version = "pg16"

[[jobs.steps]]
# from step "Check Atlas owns atlas_managed + orchestration cleanly"
name = "Check Atlas owns atlas_managed + orchestration cleanly"
command = ["bash", "atlas/scripts/check_schema.sh"]
timeout_secs = 600

[[jobs]]
# from ci-timeout-marker-selftest.yml › selftest ("CI timeout marker selftest")
name = "ci-timeout-marker-selftest-selftest"
os = "linux"

[[jobs.steps]]
# from step "Test the job-timeout marker and budget tripwire (no network)"
name = "Test the job-timeout marker and budget tripwire (no network)"
command = ["python3", "scripts/tests/test_ci_timeout_marker.py"]
timeout_secs = 300

[[jobs]]
# from ci.yml › frontend-tests ("Frontend unit tests (vitest)")
name = "frontend-tests"
os = "linux"

[[jobs.steps]]
# from step "Install frontend dependencies"
name = "Install frontend dependencies"
command = ["pnpm", "install", "--frozen-lockfile"]
timeout_secs = 900

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Run frontend unit tests"
name = "Run frontend unit tests"
command = ["pnpm", "test"]
timeout_secs = 900

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs]]
# from clippy-tiers.yml › clippy-nightly-unscoped ("Clippy nightly (unscoped, all-targets)")
name = "clippy-nightly-unscoped"
os = "linux"

[[jobs.steps]]
# from step "Install frontend dependencies"
name = "Install frontend dependencies"
command = ["pnpm", "install", "--frozen-lockfile"]
timeout_secs = 5400

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Build frontend"
name = "Build frontend"
command = ["pnpm", "run", "build"]
timeout_secs = 5400

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Clippy (unscoped, all-targets)"
name = "Clippy (unscoped, all-targets)"
command = ["cargo", "clippy", "--all-targets"]
working_dir = "src-tauri"
timeout_secs = 5400

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs]]
# from clippy-tiers.yml › clippy-diff ("Clippy diff-scoped (advisory)")
name = "clippy-diff"
os = "linux"

[[jobs.steps]]
# from step "Install frontend dependencies"
name = "Install frontend dependencies"
command = ["pnpm", "install", "--frozen-lockfile"]
timeout_secs = 5400

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Build frontend"
name = "Build frontend"
command = ["pnpm", "run", "build"]
timeout_secs = 5400

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs]]
# from clorinde-bindings-fresh.yml › clorinde-verify
name = "clorinde-verify"
os = "linux"

[[jobs.services]]
name = "postgres-pgvector"
version = "pg16"

[[jobs.steps]]
# from step "Apply Atlas-owned schema (atlas/schema.hcl)"
name = "Apply Atlas-owned schema (atlas/schema.hcl)"
command = ["bash", "atlas/scripts/apply_to.sh", "postgresql://qontinui_user:qontinui_dev_password@localhost:5433/qontinui_db"]
timeout_secs = 600

[[jobs.steps]]
# from step "Run Clorinde codegen"
name = "Run Clorinde codegen"
command = ["clorinde", "live", "--search-path", "project,public"]
working_dir = "src-tauri"

[[jobs]]
# from flake-escalation.yml › unit-tests ("Flake-escalate unit tests")
name = "unit-tests"
os = "linux"

[[jobs.steps]]
# from step "Run unit tests"
name = "Run unit tests (1/2)"
command = ["node", "--version"]
timeout_secs = 300

[[jobs.steps]]
# from step "Run unit tests"
name = "Run unit tests (2/2)"
command = ["node", "--test", "scripts/__tests__/ci-flake-escalate.test.mjs"]
timeout_secs = 300

[[jobs]]
# from frontend-coverage-producer.yml › produce ("Per-file coverage -> coord")
name = "produce"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["pnpm", "install", "--frozen-lockfile"]
timeout_secs = 5400

[[jobs.steps]]
# from step "Produce per-file coverage and POST to coord (best-effort)"
name = "Produce per-file coverage and POST to coord (best-effort)"
command = ["node", "scripts/export-test-coverage.mjs"]
timeout_secs = 5400

[[jobs]]
# from onboarding-doc-fresh.yml › onboarding-doc-verify
name = "onboarding-doc-verify"
os = "linux"

[[jobs.steps]]
# from step "Verify docs/runner-onboarding.md is fresh"
name = "Verify docs/runner-onboarding.md is fresh"
command = ["git", "diff", "--exit-code", "docs/runner-onboarding.md"]

[[jobs]]
# from page-spec-paths.yml › publish
name = "publish"
os = "linux"

[[jobs.steps]]
# from step "Node version"
name = "Node version"
command = ["node", "--version"]

[[jobs]]
# from published-parity.yml › published-parity ("Published-build parity (windows)")
name = "published-parity"
os = "windows"
schedule = "0 7 * * *"

[[jobs.steps]]
# from step "Parity comparator unit tests (PS 5.1)"
name = "Parity comparator unit tests (PS 5.1) (1/3)"
command = ["powershell", "-File", "scripts/tests/test-parity-diff.ps1"]
timeout_secs = 7200

[[jobs.steps]]
# from step "Parity comparator unit tests (PS 5.1)"
name = "Parity comparator unit tests (PS 5.1) (2/3)"
command = ["powershell", "-File", "scripts/tests/test-invoke-ps51-detached.ps1"]
timeout_secs = 7200

[[jobs.steps]]
# from step "Parity comparator unit tests (PS 5.1)"
name = "Parity comparator unit tests (PS 5.1) (3/3)"
command = ["powershell", "-File", "scripts/tests/test-installed-runner.ps1"]
timeout_secs = 7200

[[jobs]]
# from reproducibility-gate.yml › repro-build
name = "repro-build"
os = ["linux", "windows"]
schedule = "17 3 * * *"

[[jobs.steps]]
# from step "Build"
name = "Build"
command = ["cargo", "build", "--release", "--bin", "mock_claude_cli"]
working_dir = "src-tauri"

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Force rebuild of qontinui-runner package"
name = "Force rebuild of qontinui-runner package"
command = ["cargo", "clean", "-p", "qontinui-runner", "--release"]
working_dir = "src-tauri"

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Build"
name = "Build #2"
command = ["cargo", "build", "--release", "--bin", "mock_claude_cli"]
working_dir = "src-tauri"

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs]]
# from schema-pg-sql-fresh.yml › schema-fresh-verify
name = "schema-fresh-verify"
os = "linux"

[[jobs.services]]
name = "postgres-pgvector"
version = "pg16"

[[jobs.steps]]
# from step "Apply Atlas-owned schema (atlas/schema.hcl)"
name = "Apply Atlas-owned schema (atlas/schema.hcl)"
command = ["bash", "atlas/scripts/apply_to.sh", "postgresql://qontinui_user:qontinui_dev_password@localhost:5433/qontinui_db"]
timeout_secs = 600

[[jobs.steps]]
# from step "Stash checked-in artifact"
name = "Stash checked-in artifact"
command = ["cp", "schema.pg.sql.generated", "/tmp/schema.checked-in.sql"]
working_dir = "src-tauri"

[[jobs.steps]]
# from step "Regenerate (native pg_dump, no docker)"
name = "Regenerate (native pg_dump, no docker)"
command = ["bash", "src-tauri/scripts/regenerate_schema_pg_sql.sh"]

[[jobs]]
# from schema-pg-sql-freshness-nightly.yml › selftest
name = "schema-pg-sql-freshness-nightly-selftest"
os = "linux"

[[jobs.steps]]
# from step "Test the refresh-PR step's guards (stubbed gh, no network)"
name = "Test the refresh-PR step's guards (stubbed gh, no network)"
command = ["bash", "scripts/tests/test_schema_pr_step_guards.sh"]
timeout_secs = 300

[[jobs.steps]]
# from step "Test the draft->ready script (stubbed gh, no network)"
name = "Test the draft->ready script (stubbed gh, no network)"
command = ["bash", "scripts/tests/test_ready_bot_draft_pr.sh"]
timeout_secs = 300

[[jobs]]
# from schema-pg-sql-freshness-nightly.yml › nightly
name = "nightly"
os = "linux"

[[jobs.services]]
name = "postgres-pgvector"
version = "pg16"

[[jobs.steps]]
# from step "Apply Atlas-owned schema (atlas/schema.hcl)"
name = "Apply Atlas-owned schema (atlas/schema.hcl)"
command = ["bash", "atlas/scripts/apply_to.sh", "postgresql://qontinui_user:qontinui_dev_password@localhost:5433/qontinui_db"]
timeout_secs = 600

[[jobs]]
# from schemas-pair-follow-tests.yml › selftest ("schemas pair-follow selftest")
name = "schemas-pair-follow-tests-selftest"
os = "linux"

[[jobs.steps]]
# from step "Test the pair-follow decisions, build and push (fixtures, no network)"
name = "Test the pair-follow decisions, build and push (fixtures, no network)"
command = ["bash", "scripts/tests/schemas-pair-follow/run.sh"]
timeout_secs = 600

[[jobs]]
# from stacked-pr-fastlane.yml › rust-fast ("Fast lane - fmt + clippy (ubuntu)")
name = "rust-fast"
os = "linux"

[[jobs.steps]]
# from step "Install frontend dependencies"
name = "Install frontend dependencies"
command = ["pnpm", "install", "--frozen-lockfile"]
timeout_secs = 1500

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Build frontend"
name = "Build frontend"
command = ["pnpm", "run", "build"]
timeout_secs = 1500

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Format Rust code check"
name = "Format Rust code check"
command = ["cargo", "fmt", "--", "--check"]
working_dir = "src-tauri"
timeout_secs = 1500

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Clippy check"
name = "Clippy check"
command = ["cargo", "clippy"]
working_dir = "src-tauri"
timeout_secs = 1500

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs]]
# from stacked-pr-fastlane.yml › frontend-fast ("Fast lane - frontend (lint, typecheck, vitest)")
name = "frontend-fast"
os = "linux"

[[jobs.steps]]
# from step "Install frontend dependencies"
name = "Install frontend dependencies"
command = ["pnpm", "install", "--frozen-lockfile"]
timeout_secs = 600

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Lint frontend code"
name = "Lint frontend code"
command = ["pnpm", "run", "lint"]
timeout_secs = 600

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Typecheck frontend code"
name = "Typecheck frontend code"
command = ["pnpm", "run", "typecheck"]
timeout_secs = 600

[jobs.steps.env]
CARGO_TERM_COLOR = "always"

[[jobs.steps]]
# from step "Run frontend unit tests"
name = "Run frontend unit tests"
command = ["pnpm", "test"]
timeout_secs = 600

[jobs.steps.env]
CARGO_TERM_COLOR = "always"
