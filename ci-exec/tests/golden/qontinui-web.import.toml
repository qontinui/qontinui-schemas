name = "Run backend E2E tests"
command = ["pytest", "tests/test_integration_e2e.py", "-v", "--cov=app", "--cov-report=xml", "--cov-report=html", "--cov-report=term-missing"]
working_dir = "backend"
timeout_secs = 1200

[jobs.steps.env]
ENVIRONMENT = "test"
TESTING = "1"

[[jobs]]
