[[siblings]]
repo = "qontinui/qontinui-schemas"

[[siblings]]
repo = "jspinak/qontinui"

[[siblings]]
repo = "qontinui/qontinui-cloud-control"

[[tools]]
name = "node"
version = "22.11.0"

[[jobs]]
# from alembic-graph-check.yml › alembic-heads
name = "alembic-heads"
os = "linux"

[[jobs.steps]]
# from step "Notify open PRs this land forked"
name = "Notify open PRs this land forked"
command = ["python", "scripts/ci/notify_forked_open_prs.py"]
timeout_secs = 300

[[jobs]]
# from alembic-graph-pr.yml › alembic-heads-pr
name = "alembic-heads-pr"
os = "linux"

[[jobs.steps]]
# from step "Count alembic heads"
name = "Count alembic heads"
command = ["python", "scripts/ci/count_alembic_heads.py", "--baseline-ref", "origin/main"]
timeout_secs = 300

[[jobs]]
# from backend-ci.yml › lint ("Lint & Format Check")
name = "lint"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["poetry", "install", "--no-interaction", "--no-root"]
working_dir = "backend"
timeout_secs = 300

[[jobs.steps]]
# from step "Install qontinui-cloud-control into poetry venv"
name = "Install qontinui-cloud-control into poetry venv"
command = ["poetry", "run", "pip", "install", "-e", "../../qontinui-cloud-control"]
working_dir = "backend"
timeout_secs = 300

[[jobs.steps]]
# from step "Run ruff (linting)"
name = "Run ruff (linting)"
command = ["poetry", "run", "ruff", "check", "."]
working_dir = "backend"
timeout_secs = 300

[[jobs.steps]]
# from step "Run ruff format (formatting)"
name = "Run ruff format (formatting)"
command = ["poetry", "run", "ruff", "format", "--check", "."]
working_dir = "backend"
timeout_secs = 300

[[jobs.steps]]
# from step "Run mypy (type checking)"
name = "Run mypy (type checking)"
command = ["poetry", "run", "mypy", "app/", "--ignore-missing-imports"]
working_dir = "backend"
timeout_secs = 300

[[jobs]]
# from backend-ci.yml › test ("Run Tests (shard ${{ matrix.shard }}/6)")
name = "test"
os = "linux"

[[jobs.services]]
name = "postgres-pgvector"
version = "pg16"

[[jobs.services]]
name = "redis"
version = "7-alpine"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["poetry", "install", "--no-interaction", "--no-root"]
working_dir = "backend"
timeout_secs = 2700

[[jobs.steps]]
# from step "Install qontinui-cloud-control into poetry venv"
name = "Install qontinui-cloud-control into poetry venv"
command = ["poetry", "run", "pip", "install", "-e", "../../qontinui-cloud-control"]
working_dir = "backend"
timeout_secs = 2700

[[jobs.steps]]
# from step "Check OpenAPI snapshot is up to date"
name = "Check OpenAPI snapshot is up to date (1/3)"
command = ["poetry", "run", "python", "scripts/export_openapi.py"]
working_dir = "backend"
timeout_secs = 2700

[jobs.steps.env]
ENVIRONMENT = "development"
REDIS_ENABLED = "false"
SECRET_KEY = "test-secret-key-for-testing-only-minimum-32-characters-long"
TESTING = "1"

[[jobs.steps]]
# from step "Check OpenAPI snapshot is up to date"
name = "Check OpenAPI snapshot is up to date (2/3)"
command = ["poetry", "run", "python", "scripts/export_openapi.py", "--base"]
working_dir = "backend"
timeout_secs = 2700

[jobs.steps.env]
ENVIRONMENT = "development"
REDIS_ENABLED = "false"
SECRET_KEY = "test-secret-key-for-testing-only-minimum-32-characters-long"
TESTING = "1"

[[jobs.steps]]
# from step "Check OpenAPI snapshot is up to date"
name = "Check OpenAPI snapshot is up to date (3/3)"
command = ["git", "diff", "--exit-code", "frontend/src/lib/api-client/openapi-schema.json", "frontend/src/lib/api-client/openapi-schema.base.json"]
timeout_secs = 2700

[jobs.steps.env]
ENVIRONMENT = "development"
REDIS_ENABLED = "false"
SECRET_KEY = "test-secret-key-for-testing-only-minimum-32-characters-long"
TESTING = "1"

[[jobs.steps]]
# from step "Create test schemas and extensions"
name = "Create test schemas and extensions"
command = ["psql", "-h", "localhost", "-U", "qontinui_user", "-d", "qontinui_test", "-c", "CREATE SCHEMA IF NOT EXISTS project;", "-c", "CREATE SCHEMA IF NOT EXISTS auth;", "-c", "CREATE SCHEMA IF NOT EXISTS cloud;", "-c", "CREATE SCHEMA IF NOT EXISTS coord;", "-c", "CREATE SCHEMA IF NOT EXISTS strategy;", "-c", "CREATE SCHEMA IF NOT EXISTS web;", "-c", "CREATE EXTENSION IF NOT EXISTS vector;"]
working_dir = "backend"
timeout_secs = 2700

[[jobs]]
# from backend-ci.yml › security-scan ("Security Scanning")
name = "security-scan"
os = "linux"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["poetry", "install", "--no-interaction", "--no-root"]
working_dir = "backend"
timeout_secs = 900

[[jobs.steps]]
# from step "Install qontinui-cloud-control into poetry venv"
name = "Install qontinui-cloud-control into poetry venv"
command = ["poetry", "run", "pip", "install", "-e", "../../qontinui-cloud-control"]
working_dir = "backend"
timeout_secs = 900

[[jobs]]
# from backend-ci.yml › build-test ("Test Docker Build")
name = "build-test"
os = "linux"

[[jobs.steps]]
# from step "Test Docker image"
name = "Test Docker image"
command = ["docker", "run", "--rm", "qontinui-backend:test", "python", "-c", "import app; print('Import successful')"]
working_dir = "backend"
timeout_secs = 900

[[jobs]]
# from backend-coverage-producer.yml › produce ("Per-test coverage -> coord")
name = "backend-coverage-producer-produce"
os = "linux"

[[jobs.services]]
name = "postgres-pgvector"
version = "pg16"

[[jobs.services]]
name = "redis"
version = "7-alpine"

[[jobs.steps]]
# from step "Install dependencies"
name = "Install dependencies"
command = ["poetry", "install", "--no-interaction", "--no-root"]
working_dir = "backend"
timeout_secs = 5400

[[jobs.steps]]
# from step "Install qontinui-cloud-control into poetry venv"
name = "Install qontinui-cloud-control into poetry venv"
command = ["poetry", "run", "pip", "install", "-e", "../../qontinui-cloud-control"]
working_dir = "backend"
timeout_secs = 5400

[[jobs.steps]]
# from step "Create test schemas and extensions"
name = "Create test schemas and extensions"
command = ["psql", "-h", "localhost", "-U", "qontinui_user", "-d", "qontinui_test", "-c", "CREATE SCHEMA IF NOT EXISTS project;", "-c", "CREATE SCHEMA IF NOT EXISTS auth;", "-c", "CREATE SCHEMA IF NOT EXISTS cloud;", "-c", "CREATE SCHEMA IF NOT EXISTS coord;", "-c", "CREATE SCHEMA IF NOT EXISTS strategy;", "-c", "CREATE SCHEMA IF NOT EXISTS web;", "-c", "CREATE EXTENSION IF NOT EXISTS vector;"]
working_dir = "backend"
timeout_secs = 5400

[[jobs.steps]]
# from step "Run tests with coverage"
name = "Run tests with coverage"
command = ["poetry", "run", "pytest", "tests/", "-v", "--cov=app", "--cov-context=test", "--cov-report=xml", "--cov-report=html", "--cov-report=term", "--junitxml=junit-results.xml"]
working_dir = "backend"
timeout_secs = 5400

[jobs.steps.env]
ENVIRONMENT = "development"
REDIS_ENABLED = "true"
SECRET_KEY = "test-secret-key-for-testing-only-minimum-32-characters-long"
TESTING = "1"

[[jobs]]
# from dev-credentials-drift.yml › drift-check ("Check dev-credentials single source")
name = "drift-check"
os = "linux"

[[jobs.steps]]
# from step "Run drift check"
name = "Run drift check"
command = ["python", "scripts/check_dev_credentials_drift.py"]
timeout_secs = 600

[[jobs]]
# from e2e-tests.yml › backend-tests ("Backend E2E Tests")
name = "backend-tests"
